services:
  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    container_name: axp-web
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_CLIENTE_ID=${NEXT_PUBLIC_CLIENTE_ID}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Las fotos de plato del recetario. Claude no genera imágenes, así que
      # esto va contra un modelo de imagen aparte. Sin la clave el botón avisa
      # y el resto del recetario funciona igual.
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL}
      # Con esto se cifran las claves de API de los sistemas conectados
      # (Presentia). Sin esto, la pantalla de integraciones avisa y no guarda.
      - APP_SECRET=${APP_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET}
      - R2_UNRESOLVED_BUCKET=${R2_UNRESOLVED_BUCKET}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "8080:8080"
    restart: unless-stopped
