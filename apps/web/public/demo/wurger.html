<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121110">
<title>Weiss · Autoservicio</title>
<link rel="icon" href="img/logo-weiss.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Creepster&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
=====================================================================================
  WEISS · kiosco de autoservicio (v3). Un solo archivo: HTML + CSS + JS.
  Versiones anteriores: wurger-v1.html, wurger-v2.html.

  PANTALLAS
    inicio   → para comer acá / para llevar + idioma (es / en / pt)
    menu     → barra lateral de categorías + centro (atajos, grilla). Barra de pedido abajo con "Pagar".
    detalle  → la burger desarmada en grande: sacar ingredientes, sumar agregados, individual o combo
    pedido   → revisar, editar, cantidades
    pago     → tarjeta / QR / efectivo en caja (simulado)
    fin      → número de pedido, vuelve solo al inicio a los 15 s
  Inactividad: a los 90 s sin tocar nada aparece "¿Seguís ahí?" y si no responde, vuelve al inicio.

  IMÁGENES (relativas a este html)
    img/logo-weiss.png     logo BLANCO sobre transparente: va siempre sobre fondo oscuro (cabecera / insignia)
    img/fotos/*.jpg        fotos 400x300 con fondo negro (burgers y para picar)
    img/capas/<tipo>.webp  capas recortadas de la burger desarmada (si falta una, se dibuja en SVG)
    Bebidas, postres, ensaladas, bites, onion rings y crosstrax: ilustraciones SVG en este archivo.
    OJO: img/fotos/onion-rings.jpg muestra papas con cheddar y bacon, no aros: por eso Onion Rings usa ilustración.

  PRECIOS DE AGREGADOS (medallón, cheddar, bacon...): son de ejemplo, no salen de la carta. Ver AGREGADOS.

  ATAJOS POR URL
    ?pantalla=inicio|menu|detalle|pedido|pago|fin
    &cat=burgers|combos|pollo|veggie|picar|bebidas|ensaladas|postres
    ?burger=smack (= pantalla detalle)  &cerrada  &tab=ingredientes|agregados|combo
    &modo=combo2&side=boniatos&bebida=corona   &sin=tomate,salsa-ketchup   &agregar=bacon:2,cheddar
    ?lang=en|pt|es   ?llevar   ?demo (pedido de ejemplo)   ?confirmado (= fin)
    ?pantalla=pago&pago=tarjeta|qr|efectivo
    ?upsell=smack (menú con el "¿La hacés combo?" abierto)  &upsellpaso=2
    ?seguis (muestra el aviso de inactividad)   ?inactividad=10 (segundos)
    ?congelar=900   congela todas las animaciones a los 900 ms (para capturas)
    ?sincapas       no usa las capas webp (sólo SVG)
    Viejos: ?filtro=pollo|veggie|doble  ?paso=1..4
=====================================================================================
-->
<style>
@property --bw { syntax: '<length>'; inherits: true; initial-value: 200px; }
@property --gap { syntax: '<number>'; inherits: true; initial-value: 30; }
@property --pad { syntax: '<length>'; inherits: true; initial-value: 26px; }
@property --extra { syntax: '<number>'; inherits: true; initial-value: 0; }

:root {
  --bg: #ffffff;
  --sup: #f7f4ef;
  --sup-2: #efe9df;
  --borde: #e7e1d7;
  --borde-2: #d3cbbe;
  --tinta: #16130f;
  --tinta-2: #4b453d;
  --tenue: #7a7369;
  --acento: #f4b324;
  --acento-2: #ffcf5a;
  --acento-osc: #a8740a;
  --acento-velo: #fff5dc;
  --acento-txt: #1a1305;
  --rojo: #cc3b27;
  --rojo-velo: #fdeeea;
  --verde: #2b8a4c;
  --verde-velo: #e8f5ed;
  --oscuro: #121110;
  --oscuro-2: #201d1a;
  --foco: #1f6feb;
  --sombra: 0 1px 2px rgba(40, 25, 10, .06), 0 6px 18px rgba(40, 25, 10, .07);
  --sombra-2: 0 18px 60px rgba(30, 20, 10, .25);
  --r: 18px;
  --cab-h: 4.25rem;
  --barra-h: 5.75rem;
  --rail-w: 8.25rem;
  --toque: 3.5rem;

  --ease-elastico: cubic-bezier(.68, -.55, .32, 1.55);
  --ease-resorte: cubic-bezier(.34, 1.56, .64, 1);
  --ease-abre: cubic-bezier(.3, 1.28, .5, 1);       /* abre con un rebote chico */
  --ease-cierra: cubic-bezier(.5, 0, .3, 1.35);     /* al armar, el pan de arriba se apoya con un rebotecito */
  --ease-suave: cubic-bezier(.2, .8, .2, 1);
  --dur: .85s;
  --escalon: 48ms;

  --f-titulo: "Anton", Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  --f-cond: "Barlow Condensed", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --f-texto: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --abierta: 0;
}
html { font-size: 16px; -webkit-text-size-adjust: 100%; background: var(--bg); }
@media (max-width: 600px) { html { font-size: 15px; } :root { --cab-h: 3.8rem; --barra-h: 5.4rem; --rail-w: 5.6rem; } }
@media (min-width: 1000px) and (orientation: portrait) { html { font-size: 22px; } :root { --rail-w: 9.5rem; } }
@media (prefers-reduced-motion: reduce) {
  :root { --ease-elastico: ease-out; --ease-resorte: ease-out; --ease-abre: ease-out; --ease-cierra: ease-out; --dur: .2s; --escalon: 0ms; }
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  font-family: var(--f-texto); color: var(--tinta); background: var(--bg);
  line-height: 1.4; overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
h1, h2, h3, p { margin: 0; }
img { display: block; }
ul { list-style: none; margin: 0; padding: 0; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; }
.well, .ing-media, .agr-media, .op-media, .combo-arte, .rail-img, .escenario, .tile, .card { isolation: isolate; }
#defs-host { position: absolute; width: 0; height: 0; overflow: hidden; }
svg.ilu { display: block; width: 100%; height: 100%; overflow: visible; }
.ico { width: 1.4em; height: 1.4em; flex: none; }

/* ---------- botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: var(--toque); padding: 0 1.4rem; border-radius: 999px; border: 2px solid transparent;
  font-family: var(--f-cond); font-weight: 800; font-size: 1.15rem; letter-spacing: .04em; text-transform: uppercase;
  white-space: nowrap; transition: transform .25s var(--ease-resorte), background-color .2s, box-shadow .2s, opacity .2s;
}
.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .4; }
.btn-pri { background: var(--acento); color: var(--acento-txt); box-shadow: 0 6px 18px rgba(244, 179, 36, .38); }
.btn-pri:hover:not(:disabled) { background: var(--acento-2); }
.btn-osc { background: var(--tinta); color: #fff; }
.btn-sec { background: #fff; color: var(--tinta); border-color: var(--tinta); }
.btn-ghost { background: var(--sup); color: var(--tinta); }
.btn-xl { min-height: calc(var(--toque) + .5rem); padding: 0 2rem; font-size: 1.35rem; }
.btn-ancho { width: 100%; }

/* =========================================================
   CABECERA (banda oscura: el logo es blanco)
   ========================================================= */
.cab {
  position: sticky; top: 0; z-index: 45;
  height: var(--cab-h); background: var(--oscuro); color: #fff;
  display: flex; align-items: center; gap: .6rem; padding: 0 1rem;
}
.cab-logo { border: 0; background: none; padding: 0; display: flex; align-items: center; }
.cab-logo img { height: calc(var(--cab-h) - .9rem); width: auto; }
.cab-chip, .cab-btn {
  display: inline-flex; align-items: center; gap: .45rem; min-height: 2.9rem; padding: 0 1rem;
  border-radius: 999px; border: 1.5px solid rgba(255, 255, 255, .42); background: #1d1b19; box-shadow: 0 2px 8px rgba(0, 0, 0, .45);
  font-family: var(--f-cond); font-weight: 700; font-size: 1rem; letter-spacing: .04em; text-transform: uppercase; color: #fff;
}
.cab-chip .ico:last-child { width: 1em; height: 1em; opacity: .7; }
.cab-chip:hover, .cab-btn:hover { background: #2c2926; }
.esp { flex: 1; }
@media (max-width: 600px) {
  .cab { gap: .4rem; padding: 0 .6rem; }
  .cab-txt, .cab-chip .ico:last-child { display: none; }
  .cab-chip, .cab-btn { padding: 0 .7rem; min-height: 2.75rem; font-size: .9rem; }
}

/* =========================================================
   INICIO · blanco y aireado: la burger es la estrella; la identidad de los locales como acentos
   ========================================================= */
.inicio {
  position: fixed; inset: 0; z-index: 60; overflow: hidden;
  background: radial-gradient(ellipse 62% 70% at 74% 52%, #fff1d4, #fffaf2 46%, #fff 72%);
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "banda banda" "txt hero";
}
.ini-banda { grid-area: banda; height: 2.6rem; overflow: hidden; position: relative; }
.ini-txt { grid-area: txt; display: flex; flex-direction: column; justify-content: center; gap: 1.5rem; padding: 1.4rem 1.6rem 1.6rem 3.4rem; min-height: 0; overflow: clip; }
.ini-marca { display: flex; align-items: center; gap: 1.6rem; }
.ini-insignia { position: relative; flex: none; width: 6.2rem; height: 6.2rem; border-radius: 50%; background: var(--oscuro); display: grid; place-items: center; box-shadow: 0 14px 34px rgba(0, 0, 0, .22); }
.ini-insignia img { width: 72%; height: auto; }
.ini-marca .ini-insignia { width: 12.5rem; height: 12.5rem; }
.ini-insignia.anillo::after { content: ""; position: absolute; inset: -.65rem; border-radius: 50%; border: 3px dashed var(--acento); animation: gira 40s linear infinite; }
.ini-hola { font-family: var(--f-titulo); font-weight: 400; text-transform: uppercase; line-height: .92; font-size: clamp(3rem, 5.4vw, 5.4rem); white-space: nowrap; }
.ini-local { font-family: var(--f-titulo); font-weight: 400; text-transform: uppercase; font-size: clamp(1.5rem, 2.3vw, 2.2rem); line-height: 1; margin-top: .25rem; white-space: nowrap; color: var(--tinta-2); }
.ini-local b { font-weight: 400; color: var(--acento-osc); }
.ini-pasos { display: flex; flex-wrap: nowrap; gap: .35rem 1rem; margin-top: 1rem; }
.ini-paso { display: inline-flex; align-items: center; gap: .45rem; font-family: var(--f-cond); font-weight: 800; font-size: 1.3rem; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.ini-paso i { font-style: normal; width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--acento); color: var(--acento-txt); display: grid; place-items: center; font-size: 1rem; }
.ini-abajo { display: flex; flex-direction: column; gap: 1rem; }
.ini-pregunta { font-family: var(--f-cond); font-weight: 800; font-size: 1.25rem; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); white-space: nowrap; }
.ini-opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.ini-op {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem; padding: 1rem 1rem 1.2rem;
  height: 12.5rem; overflow: hidden; border-radius: 26px; border: 2px solid var(--borde); background: #fff;
  box-shadow: 0 14px 34px rgba(40, 25, 10, .1);
  transition: transform .3s var(--ease-resorte), border-color .2s, box-shadow .2s;
}
.ini-op:hover { border-color: var(--acento); box-shadow: 0 16px 40px rgba(244, 179, 36, .25); }
.ini-op:active { transform: scale(.97); }
.ini-op svg { width: 6.8rem; height: 6.8rem; }
.ini-op b { font-family: var(--f-titulo); font-weight: 400; font-size: 1.7rem; text-transform: uppercase; line-height: 1; min-height: 1.05em; white-space: nowrap; }
.ini-op small { color: var(--tenue); font-size: .92rem; white-space: nowrap; }
.inicio.llamar .ini-op { animation: llamar .6s var(--ease-resorte); }
@keyframes llamar { 30% { transform: scale(1.04); border-color: var(--acento); } }
.ini-idiomas { display: flex; flex-wrap: nowrap; align-items: center; gap: .5rem; }
.lang-btn {
  min-height: var(--toque); padding: 0 1.1rem; border-radius: 999px; border: 2px solid var(--borde-2); background: #fff;
  font-weight: 700; font-size: 1.02rem; display: inline-flex; align-items: center; gap: .5rem; white-space: nowrap;
}
.lang-btn[aria-pressed="true"] { border-color: var(--tinta); background: var(--tinta); color: #fff; }
.lang-btn .bandera { width: 1.6rem; height: 1.6rem; border-radius: 50%; overflow: hidden; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.1); }
/* héroe: la burger, grande, con su sombra; y el cartel de neón como detalle */
.ini-hero { grid-area: hero; position: relative; min-height: 0; overflow: hidden; container-type: size; }
.ini-hero .escenario { position: absolute; inset: 3% 3% 4% 20%; width: auto; height: auto; }
.ini-hero-nombre { position: absolute; right: 1.6rem; bottom: 1.1rem; z-index: 5; text-align: right; color: var(--tinta); font-family: var(--f-titulo); text-transform: uppercase; font-size: 1.4rem; line-height: 1; }
.ini-hero-nombre small { display: block; font-family: var(--f-cond); font-weight: 700; font-size: .85rem; letter-spacing: .12em; color: var(--acento-osc); }
.ini-cartel { position: absolute; left: 4%; top: 9%; z-index: 4; transform: rotate(-3deg); transform-origin: 50% 0; }
.ini-cartel::before, .ini-cartel::after { content: ""; position: absolute; bottom: 100%; width: 1.5px; height: 4.5rem; background: linear-gradient(#0000, #6d665c); }
.ini-cartel::before { left: 18%; } .ini-cartel::after { right: 18%; }
.ini-neon {
  margin: 0; display: flex; flex-direction: column; padding: .9rem 1.2rem 1rem; border-radius: 14px;
  background: radial-gradient(ellipse at 50% 40%, #221d19, #0d0c0b 80%);
  box-shadow: 0 18px 40px rgba(0, 0, 0, .3), inset 0 0 0 1.5px #2e2925;
  font-family: var(--f-cond); font-weight: 800; text-transform: uppercase; line-height: 1; letter-spacing: .03em;
  font-size: min(5.4cqh, calc(56cqw / var(--nn)), 2.3rem); color: transparent; -webkit-text-stroke: .05em #ffe2b0;
}
.ini-neon span { filter: drop-shadow(0 0 1px #ffb04a) drop-shadow(0 0 5px #ff9426) drop-shadow(0 0 14px rgba(255, 112, 0, .7)); animation: neonOn 1.8s steps(1) both; }
.ini-neon span:nth-child(2) { animation-delay: .15s; } .ini-neon span:nth-child(3) { animation-delay: .35s; }
.ini-neon span:nth-child(4) { animation: neonOn 1.8s steps(1) .55s both, neonTitila 8s steps(1) 4s infinite; }
@keyframes neonOn { 0% { opacity: .06; } 12% { opacity: 1; } 17% { opacity: .15; } 26% { opacity: 1; } 33% { opacity: .35; } 38%, 100% { opacity: 1; } }
@keyframes neonTitila { 0%, 90%, 100% { opacity: 1; } 91% { opacity: .3; } 92% { opacity: 1; } 95% { opacity: .55; } 96% { opacity: 1; } }
/* variante B: neón naranja directo sobre blanco, sin placa */
.inicio.var-b .ini-cartel { transform: none; }
.inicio.var-b .ini-cartel::before, .inicio.var-b .ini-cartel::after { display: none; }
.inicio.var-b .ini-neon { background: none; box-shadow: none; padding: 0; -webkit-text-stroke: .055em #ff8a1f; font-size: min(6.6cqh, calc(64cqw / var(--nn)), 2.9rem); }
.inicio.var-b .ini-neon span { filter: drop-shadow(0 0 3px rgba(255, 150, 40, .9)) drop-shadow(0 0 12px rgba(255, 120, 0, .45)); }
.inicio.var-b .ini-banda { order: 0; }
.inicio.var-b { grid-template-areas: "txt hero" "banda banda"; grid-template-rows: minmax(0, 1fr) auto; }
.ini-tira { grid-area: tira; background: var(--oscuro); overflow: hidden; padding: .8rem 0; }
.ini-tira-in { display: flex; gap: .8rem; width: max-content; animation: tira 60s linear infinite; }
.ini-tira img { width: 11rem; height: 8.25rem; object-fit: cover; border-radius: 14px; }
@keyframes tira { to { transform: translateX(-50%); } }
@media (orientation: landscape) and (max-height: 800px) {
  .ini-txt { gap: 1rem; padding-top: .8rem; padding-bottom: 1rem; }
  .ini-marca .ini-insignia { width: 9.5rem; height: 9.5rem; }
  .ini-hola { font-size: clamp(2.4rem, 4.2vw, 3.8rem); }
  .ini-op { height: 9.6rem; } .ini-op svg { width: 4.8rem; height: 4.8rem; }
  .ini-tira img { width: 8.5rem; height: 6.4rem; }
  .ini-banda { height: 2rem; }
}
@media (orientation: portrait) {
  .inicio, .inicio.var-b { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr) auto auto; grid-template-areas: "banda" "cabeza" "hero" "txt" "tira";
    background: radial-gradient(ellipse 80% 40% at 50% 52%, #fff1d4, #fffaf2 50%, #fff 75%); }
  .ini-txt { display: contents; }
  .ini-marca { grid-area: cabeza; flex-direction: column; gap: .9rem; padding: 1.6rem 1.2rem 0; text-align: center; }
  .ini-marca .ini-insignia { width: 13rem; height: 13rem; }
  .ini-pasos { justify-content: center; }
  .ini-abajo { grid-area: txt; padding: .4rem 1.4rem 1.3rem; }
  .ini-pregunta { text-align: center; }
  .ini-idiomas { justify-content: center; }
  .ini-hero .escenario { inset: 2% 4% 3% 30%; }
  .ini-cartel { left: 5%; top: 9%; } .ini-cartel::before, .ini-cartel::after { height: 2.4rem; }
  .ini-neon { font-size: min(7.5cqh, calc(52cqw / var(--nn)), 2.6rem); }
  .inicio.var-b .ini-neon { font-size: min(8.5cqh, calc(60cqw / var(--nn)), 3rem); }
  .ini-tira img { width: 8rem; height: 6rem; }
}
@media (orientation: portrait) and (max-height: 1100px) and (min-width: 520px) {
  .ini-marca { flex-direction: row; justify-content: center; text-align: left; gap: 1.4rem; padding-top: 1.2rem; }
  .ini-marca .ini-insignia { width: 10.5rem; height: 10.5rem; }
  .ini-pasos { justify-content: flex-start; }
  .ini-op { height: 9.6rem; } .ini-op svg { width: 4.8rem; height: 4.8rem; }
}
@media (min-width: 1000px) and (orientation: portrait) { .ini-marca .ini-insignia { width: 14rem; height: 14rem; } .ini-marca { padding-top: 2.2rem; } .ini-banda { height: 3rem; } }
@media (max-width: 700px) {
  .ini-banda { height: 1.8rem; }
  .ini-marca { padding-top: 1rem; gap: .5rem; }
  .ini-marca .ini-insignia { width: 7.6rem; height: 7.6rem; }
  .ini-hola { font-size: 2.7rem; }
  .ini-local { font-size: 1.35rem; }
  .ini-paso { font-size: 1rem; } .ini-paso i { width: 1.45rem; height: 1.45rem; font-size: .85rem; }
  .ini-pasos { gap: .3rem .7rem; margin-top: .6rem; }
  .ini-pregunta { font-size: 1.05rem; }
  .ini-op { height: 9.2rem; padding: .7rem .5rem .8rem; }
  .ini-op svg { width: 4.4rem; height: 4.4rem; }
  .ini-op b { font-size: 1.22rem; }
  .ini-op small { font-size: .78rem; }
  .lang-btn { padding: 0 .75rem; font-size: .92rem; min-height: 3.2rem; }
  .ini-abajo { padding: .2rem .9rem 1rem; gap: .8rem; }
  .ini-tira { padding: .5rem 0; }
  .ini-tira img { width: 5.5rem; height: 4.2rem; border-radius: 10px; }
  .ini-hero-nombre { font-size: 1.05rem; right: .9rem; bottom: .4rem; }
  .ini-cartel { top: 10%; left: 4%; } .ini-cartel::before, .ini-cartel::after { height: 2.6rem; }
  .ini-neon { padding: .55rem .7rem .6rem; border-radius: 10px; }
}
@media (prefers-reduced-motion: reduce) { .ini-neon span { animation: none !important; opacity: 1; } }

/* =========================================================
   MENÚ
   ========================================================= */
main { padding-bottom: var(--barra-h); }
body[data-pantalla="fin"] main, body[data-pantalla="inicio"] main { padding-bottom: 0; }
.menu { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); }
.rail {
  position: sticky; top: var(--cab-h); align-self: start;
  height: calc(100vh - var(--cab-h) - var(--barra-h)); height: calc(100dvh - var(--cab-h) - var(--barra-h));
  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  background: var(--sup); border-right: 1px solid var(--borde);
  padding: .6rem .45rem 1rem; display: flex; flex-direction: column; gap: .3rem;
}
.rail::-webkit-scrollbar { display: none; }
.rail-btn {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: .35rem;
  min-height: 5.6rem; padding: .55rem .25rem .6rem; border: 0; border-radius: 16px; background: transparent;
  font-family: var(--f-cond); font-weight: 700; font-size: .95rem; line-height: 1.05; letter-spacing: .02em; text-transform: uppercase;
  color: var(--tinta-2); text-align: center; transition: background-color .2s, color .2s;
}

/* grilla de productos */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(14.5rem, 1fr)); gap: 1rem; }
@media (min-width: 1000px) and (orientation: portrait) { .grid { grid-template-columns: repeat(3, 1fr); } }

.grid > li { animation: entra .45s var(--ease-suave) backwards; }

.card {
  position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; padding: 0; border: 0;
  border-radius: var(--r); overflow: hidden; background: #fff; text-align: left;

}

.well {
  position: relative; aspect-ratio: 4 / 3; width: 100%; container-type: size; overflow: hidden;
  display: grid; place-items: center; background: var(--sup);
}

.well > img.foto { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease-suave); }
.card:hover .well > img.foto { transform: scale(1.05); }
.well > svg.ilu { width: 80%; height: 86%; }
.well > .pila { --bw: min(60cqw, calc(80cqh * 300 / var(--hc))); }
.card-cuerpo { display: flex; flex-direction: column; gap: .25rem; padding: .75rem .9rem .9rem; flex: 1; }
.card-nombre { font-family: var(--f-titulo); font-weight: 400; text-transform: uppercase; font-size: 1.3rem; line-height: 1.02; }
.card-desc { color: var(--tenue); font-size: .86rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-pie { margin-top: auto; padding-top: .5rem; display: flex; align-items: center; justify-content: space-between; gap: .4rem; }

.card:hover .card-mas { background: var(--acento); color: var(--acento-txt); }
.card-badge {
  position: absolute; top: .55rem; left: .55rem; z-index: 3;
  background: var(--acento); color: var(--acento-txt); border-radius: 999px; padding: .2rem .65rem;

}
.preset {

}

/* tarjetas de combo */
.combos { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: 1rem; }
@media (max-width: 600px) { .combos { grid-template-columns: 1fr; } }
.combo-card { display: flex; flex-direction: column; border: 0; padding: 0; border-radius: 22px; overflow: hidden; background: #fff; box-shadow: var(--sombra), 0 0 0 1px var(--borde); text-align: left; transition: transform .3s var(--ease-resorte), box-shadow .2s; }
.combo-card:hover { box-shadow: 0 10px 28px rgba(40, 25, 10, .14), 0 0 0 2px var(--acento); }
.combo-card .arte-box { background: radial-gradient(ellipse 70% 70% at 50% 45%, #fffaf1, #f1eadf 75%); padding: .8rem 1rem .2rem; }
.combo-card .cuerpo { padding: .9rem 1.1rem 1.1rem; display: flex; flex-direction: column; gap: .3rem; }
.combo-card b { font-family: var(--f-titulo); font-weight: 400; font-size: 1.8rem; text-transform: uppercase; line-height: 1; }
.combo-card .precio { font-weight: 800; font-size: 1.3rem; }
.combo-card .btn { margin-top: .6rem; }
.combo-arte { position: relative; display: block; width: 100%; aspect-ratio: 16 / 10; }
.combo-arte > span { position: absolute; display: block; }
.combo-arte { container-type: size; }
/* escala real: --u = px por cm (lo más alto entra en el alto; el grupo entra en el ancho) */
.combo-arte > span { --u: min(calc(86cqh / var(--hmax, 25)), calc(96cqw / var(--wtot, 30))); --bwa: calc(var(--u) * 12.1); }
.ca-burger { left: 50%; bottom: 6%; translate: -50% 0; width: var(--bwa); height: 92%; display: grid !important; place-items: end center; z-index: 3; }
.ca-burger .pila { --bw: var(--bwa); }
.ca-side, .ca-bebida { bottom: calc(6% - var(--bwa) * .04 + var(--bwa) * .035); width: calc(var(--bwa) * var(--f)); height: auto; aspect-ratio: 1; z-index: 2; translate: -50% 0; }
.ca-side { left: calc(50% - var(--bwa) * var(--k)); }
.ca-bebida { left: calc(50% + var(--bwa) * var(--k)); }
.ca-side svg.ilu, .ca-bebida svg.ilu { width: 100%; height: 100%; display: block; }

/* =========================================================
   LA PILA DE CAPAS (cards, detalle, inicio)
   ========================================================= */
.pila {
  --u: calc(var(--bw) / 300);
  position: relative; display: flex; flex-direction: column; width: var(--bw); flex: none;
}
.pila::after {
  content: ""; position: absolute; z-index: 0;
  left: -8%; right: -8%; bottom: calc(-13 * var(--u)); height: calc(30 * var(--u));
  background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(40, 22, 8, .42), rgba(40, 22, 8, .16) 50%, transparent 72%);
  pointer-events: none;
}
.well.oscuro .pila::after { background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0, 0, 0, .9), rgba(0, 0, 0, .45) 45%, transparent 72%); }
.capa {
  position: relative; display: block; flex: none;
  height: calc(var(--vh) * var(--u));
  margin-top: calc(var(--mc) * var(--u));
  z-index: calc(100 - var(--i));
  transform: translateY(calc(var(--abierta) * var(--sube) * var(--gap) * var(--u) * -1));
  transform-origin: 50% 100%;
}
.escenario .capa {
  transition: transform var(--dc, var(--dur)) var(--ease-abre) calc(var(--i) * var(--escalon));
  will-change: transform;
}
/* al armar, el pan de arriba es el último en bajar (rebota al apoyarse) */
.escenario.sin-trans .capa, .escenario.sin-trans .pila { transition: none !important; }
.escenario:not(.abierta) .capa { transition-timing-function: var(--ease-cierra); transition-delay: calc((var(--n) - 1 - var(--i)) * var(--escalon)); }
.capa > svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
.capa > .capa-img { position: absolute; max-width: none; height: auto; pointer-events: none; }
/* huevo: entero → roto (fundido corto) y las dos gotas de yema que cuelgan se alargan despacio */
.capa > .huevo-entero, .capa > .huevo-roto { transition: opacity .25s ease; }
.capa > .huevo-roto { opacity: 0; }
.capa.roto > .huevo-roto { opacity: 1; }
.capa.roto > .huevo-entero { opacity: 0; }
.huevo-roto.cuerpo { -webkit-mask-image: linear-gradient(to bottom, #000 76.5%, transparent 79.5%); mask-image: linear-gradient(to bottom, #000 76.5%, transparent 79.5%); }
.huevo-roto.gotas { -webkit-mask-image: linear-gradient(to bottom, transparent 76%, #000 79%); mask-image: linear-gradient(to bottom, transparent 76%, #000 79%); transform-origin: 50% 77.5%; scale: 1 1; }
.capa.roto > .huevo-roto.gotas { scale: 1 1.5; transition: opacity .25s ease, scale 3.2s cubic-bezier(.22, .6, .3, 1) .2s; }
.capa.roto-ya > .huevo-entero, .capa.roto-ya > .huevo-roto { transition: none; }
/* sombra de contacto (burger armada) */
.capa::before {
  content: ""; position: absolute; z-index: -1; left: 9%; right: 9%;
  top: calc((var(--b) - 3) * var(--u)); height: calc(20 * var(--u));
  background: radial-gradient(ellipse 50% 50% at 50% 35%, rgba(25, 8, 0, .55), transparent 72%);
  opacity: calc(1 - var(--abierta)); transition: opacity .35s ease; pointer-events: none;
}
/* sombra que cada capa proyecta sobre la de abajo cuando está desarmada: más lejos y más difusa cuanto mayor el hueco */
.capa::after {
  content: ""; position: absolute; z-index: -1; left: 12%; right: 12%;
  top: calc((var(--b) - 2 + var(--abierta) * var(--gap) * .92) * var(--u));
  height: calc((16 + var(--gap) * .35) * var(--u));
  background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(45, 20, 5, .30), rgba(45, 20, 5, .10) 55%, transparent 74%);
  opacity: calc(var(--abierta) * .95);
  transition: opacity .5s ease, top var(--dur) var(--ease-elastico) calc(var(--i) * var(--escalon));
  pointer-events: none;
}
.capa:last-child::after { display: none; }
.well .capa::after, .well .capa::before { display: none; }
/* respiración: cada capa flota un poquito, desfasada */
.escenario.abierta.quieta .capa > .capa-img, .escenario.abierta.quieta .capa > svg { animation: flota 3.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.53s); }
@keyframes flota { 50% { translate: 0 calc(var(--flota, 2.4) * -1px); } }
/* brillo que recorre el pan de arriba */
.brillo {
  position: absolute; left: 10%; right: 10%; top: 4%; height: 64%; pointer-events: none; border-radius: 50% 50% 44% 44% / 80% 80% 30% 30%;
  overflow: hidden; mix-blend-mode: soft-light; opacity: .9;
}
.brillo::before {
  content: ""; position: absolute; top: -20%; bottom: -20%; width: 34%; left: -40%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .95) 45%, rgba(255, 255, 255, .95) 55%, transparent);
  animation: brillo 5.5s ease-in-out infinite 1.2s;
}
@keyframes brillo { 0%, 55% { left: -40%; } 85%, 100% { left: 110%; } }

/* etiquetas */
.tag {
  position: absolute; top: calc(var(--ty) * var(--u));
  display: flex; align-items: center; gap: .45em;
  width: min(14rem, calc(50cqw - var(--bw) * .5 - 8px));
  color: var(--tinta); text-align: left; pointer-events: none;
  opacity: var(--abierta);
  --tx: calc((1 - var(--abierta)) * 14px);
  transition:
    opacity .35s ease calc(var(--abierta) * (260ms + var(--i) * var(--escalon))),
    transform var(--dur) var(--ease-elastico) calc(var(--abierta) * (260ms + var(--i) * var(--escalon)));
  z-index: 50;
}
.tag::before {
  content: ""; flex: none; width: 30px; height: 9px;
  background:
    radial-gradient(circle at 4px 50%, var(--c-tag, var(--acento-osc)) 3.2px, transparent 3.7px),
    linear-gradient(var(--c-tag, var(--acento-osc)), var(--c-tag, var(--acento-osc))) 4px 50% / calc(100% - 4px) 1.5px no-repeat;
}
.tag b { display: block; font-family: var(--f-cond); font-weight: 800; font-size: .98rem; letter-spacing: .02em; text-transform: uppercase; line-height: 1.02; }
.tag small { display: block; font-size: .78rem; color: var(--tenue); line-height: 1.2; margin-top: 1px; }
.der .tag { left: 97%; transform: translate(calc(-1 * var(--tx)), -50%); }
.izq .tag { right: 97%; flex-direction: row-reverse; text-align: right; transform: translate(var(--tx), -50%); }
.izq .tag::before {
  background:
    radial-gradient(circle at calc(100% - 4px) 50%, var(--c-tag, var(--acento-osc)) 3.2px, transparent 3.7px),
    linear-gradient(var(--c-tag, var(--acento-osc)), var(--c-tag, var(--acento-osc))) 0 50% / calc(100% - 4px) 1.5px no-repeat;
}
.capa.nueva { --c-tag: var(--verde); }
.capa.nueva .tag b { color: var(--verde); }
@media (max-width: 600px) {
  .tag small { display: none; }
  .tag b { font-size: .72rem; }
  .tag { gap: .2em; }
  .tag::before { width: 12px; }
}
@media (min-width: 1000px) and (orientation: portrait) { .tag b { font-size: .9rem; } }

/* =========================================================
   DETALLE
   ========================================================= */
.detalle { display: grid; grid-template-columns: minmax(0, 44fr) minmax(0, 56fr); }
.esc-col {
  position: sticky; top: var(--cab-h); align-self: start;
  height: calc(100vh - var(--cab-h) - var(--barra-h)); height: calc(100dvh - var(--cab-h) - var(--barra-h));
  container-type: inline-size; display: flex; flex-direction: column; overflow: hidden;
  background: radial-gradient(ellipse 58% 52% at 50% 56%, #fff1d2, #fffaf0 50%, #fff 78%);
  border-right: 1px solid var(--borde);
}
.esc-caja { position: relative; flex: 1; min-height: 0; }
.escenario { --pad: 26px; position: absolute; inset: 0; transition: --bw .55s var(--ease-suave), --gap .55s var(--ease-suave), --extra .55s var(--ease-suave), --pad .55s var(--ease-suave); }

  padding: 0 0 var(--pad); border: 0; background: none; cursor: pointer;
}
.burger:focus-visible { outline: none; }
.burger:focus-visible::after { content: ""; position: absolute; inset: 8px; border-radius: 24px; border: 2px dashed var(--foco); pointer-events: none; }
.escenario .pila {
  transform: translateY(calc((1 - var(--abierta)) * var(--extra) * var(--bw) / 300 * -.5));
  transition: transform var(--dur) var(--ease-suave);
}
.esc-foto {
  position: absolute; left: 50%; top: 50%; width: min(86%, 620px); aspect-ratio: 4 / 3; object-fit: cover; border-radius: 26px;
  transform: translate(-50%, -50%) scale(.94); opacity: 0; pointer-events: none; transition: opacity .45s ease, transform .5s var(--ease-suave);
  box-shadow: var(--sombra-2);
}
.esc-col.foto .esc-foto { opacity: 1; transform: translate(-50%, -50%); }
.esc-col.foto .escenario { opacity: 0; transition: opacity .3s; }
.esc-pie { position: absolute; top: .8rem; right: .8rem; z-index: 6; display: flex; flex-direction: column; gap: .45rem; align-items: flex-end; }
.pill {
  display: inline-flex; align-items: center; gap: .45rem; min-height: 3rem; padding: 0 1.1rem; border-radius: 999px;
  border: 1.5px solid var(--borde-2); background: #fff; font-weight: 700; font-size: .95rem; box-shadow: var(--sombra);
}
.pill[aria-pressed="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }
.sin-lista { position: absolute; top: .9rem; left: .9rem; right: 9.5rem; z-index: 4; display: flex; gap: .4rem; flex-wrap: wrap; pointer-events: none; }
.sin-lista span { pointer-events: auto; font-family: var(--f-cond); font-weight: 800; letter-spacing: .03em; text-transform: uppercase; font-size: .9rem; padding: .3rem .75rem; border-radius: 999px; background: var(--rojo-velo); color: var(--rojo); border: 1.5px solid #f2c3bb; animation: pop .4s var(--ease-resorte); }
.sin-lista span.mas { background: var(--verde-velo); color: var(--verde); border-color: #bfe3cc; }

.panel { padding: 1.5rem 1.7rem 2rem; min-width: 0; }
.det-num { font-family: var(--f-cond); font-weight: 800; color: var(--acento-osc); letter-spacing: .14em; font-size: .9rem; text-transform: uppercase; }
.det-nombre { font-family: var(--f-titulo); font-weight: 400; text-transform: uppercase; line-height: .95; font-size: clamp(2.2rem, 4vw, 3.3rem); margin-top: .15rem; }
.det-nombre:focus { outline: none; }
.det-ing { color: var(--tinta-2); margin-top: .5rem; font-size: 1.05rem; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: .4rem; margin: 1.2rem 0 1rem; padding: .35rem; background: var(--sup); border-radius: 18px; }
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem; min-height: var(--toque); padding: .35rem .3rem;

/* =========================================================
   ESCENA DEL COMBO: side y bebida en el escenario, junto a la burger
   ========================================================= */
.esc-col.con-combo .escenario { --pad: 6.6rem; }
.esc-col.con-combo .escenario .pila { transform: none; }
.esc-col.con-combo .esc-pie { display: none; }
.esc-col.con-combo .burger { cursor: default; }
.esc-col.con-items .burger, .ce-marco.con-items .ce-burger { transform: none; }
.burger { transition: transform .6s var(--ease-resorte); }
.ce { position: absolute; inset: 0; pointer-events: none; z-index: 2; opacity: 0; transition: opacity .35s; }
.esc-col.con-combo .ce, .ce-marco .ce { opacity: 1; }
.ce::before {   /* piso común: una sola sombra para burger, side y bebida */
  content: ""; position: absolute; left: 50%; bottom: calc(var(--pad) - var(--bw) * .07); width: calc(var(--bw) * 1.2); height: calc(var(--bw) * .16);
  transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(45, 22, 6, .22), transparent 72%);
  transition: width .5s var(--ease-suave);
}
.esc-col.con-items .ce::before, .ce-marco.con-items .ce::before { width: calc(var(--bw) * 2.3); }
.ce-item { position: absolute; margin: 0; bottom: var(--pad); transform: translateX(-50%); transform-origin: 50% 100%; display: block; }
.ce-item svg.ilu { width: 100%; height: auto; aspect-ratio: 1; overflow: visible; }
.ce-side { width: calc(var(--bw) * var(--f, .7)); left: calc(50% + var(--bw) * .3); z-index: 3; }
.ce-bebida { width: calc(var(--bw) * var(--f, .66)); left: calc(50% + var(--bw) * .8); z-index: 1; }
.ce-item.solo { left: calc(50% + var(--bw) * .55); }
.ce-item figcaption, .ce-cap {
  position: absolute; top: calc(100% + .5rem); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(var(--bw) * .8);
  text-align: center; font-family: var(--f-cond); font-weight: 800; font-size: .95rem; letter-spacing: .03em; text-transform: uppercase; line-height: 1.05; color: var(--tinta);
}
.ce-item figcaption small, .ce-cap small { display: block; font-family: var(--f-texto); font-weight: 600; text-transform: none; letter-spacing: 0; font-size: .75rem; color: var(--tenue); }
.ce-cap { top: auto; bottom: calc(var(--pad) - .5rem); transform: translate(-50%, 100%); max-width: calc(var(--bw) * 1.05); transition: left .6s var(--ease-resorte); }
.esc-col.con-items .ce-cap, .ce-marco.con-items .ce-cap { left: calc(50% - var(--bw) * .54); }
.ce:not(.hay-cap) .ce-cap { left: 50%; }
.ce-precio {
  position: absolute; left: 50%; bottom: .8rem; transform: translateX(-50%); white-space: nowrap;
  display: inline-flex; align-items: center; gap: .6rem; padding: .4rem 1rem; border-radius: 999px; background: var(--tinta); color: #fff;
  font-family: var(--f-cond); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 1rem;
}
.ce-precio b { font-family: var(--f-titulo); font-weight: 400; font-size: 1.25rem; color: var(--acento); letter-spacing: .02em; }
.ce-item.entra { animation: ceCae .7s both; }
@keyframes ceCae {
  0% { translate: 0 -140%; opacity: 0; animation-timing-function: cubic-bezier(.55, 0, .9, .45); }
  20% { opacity: 1; }
  68% { translate: 0 0; scale: 1.05 .92; animation-timing-function: ease-out; }
  84% { translate: 0 -5%; scale: .98 1.03; animation-timing-function: ease-in-out; }
  100% { translate: 0 0; scale: 1 1; }
}
/* en el modal del upsell: el mismo armado, a escala fija */
.ce-modal { position: relative; height: 17rem; margin: .2rem 0 .8rem; border-radius: 22px; overflow: hidden; container-type: size;

/* =========================================================
   REALISMO: cheddar que se derrite (la carne sólo con un leve realce fijo)
   ========================================================= */
.queso-cuerpo { -webkit-mask-image: linear-gradient(#000 0 calc(var(--qb) * 100% - 26%), transparent calc(var(--qb) * 100% - 18%)); mask-image: linear-gradient(#000 0 calc(var(--qb) * 100% - 26%), transparent calc(var(--qb) * 100% - 18%)); transform-origin: 50% 30%; }
.queso-borde { -webkit-mask-image: linear-gradient(transparent 0 calc(var(--qb) * 100% - 28%), #000 calc(var(--qb) * 100% - 20%) calc(var(--qb) * 100% - 6%), transparent calc(var(--qb) * 100% + 2%)); mask-image: linear-gradient(transparent 0 calc(var(--qb) * 100% - 28%), #000 calc(var(--qb) * 100% - 20%) calc(var(--qb) * 100% - 6%), transparent calc(var(--qb) * 100% + 2%)); transform-origin: 50% calc(var(--qb) * 100% - 26%); }
.queso-gotas { -webkit-mask-image: linear-gradient(transparent 0 calc(var(--qb) * 100% - 6%), #000 calc(var(--qb) * 100% + 2%)); mask-image: linear-gradient(transparent 0 calc(var(--qb) * 100% - 6%), #000 calc(var(--qb) * 100% + 2%)); transform-origin: 50% calc(var(--qb) * 100%); }
.queso-brillo-img { mix-blend-mode: screen; opacity: .75; pointer-events: none; transform-origin: 50% 38%; }
.capa.sin-derretir .queso-gotas { scale: 1 .6; }
.capa.derretido .queso-cuerpo { animation: quesoAncho 1.8s cubic-bezier(.25, .7, .3, 1) forwards; }
.capa.derretido .queso-borde, .capa.derretido .queso-brillo-img { animation: quesoVence 1.8s cubic-bezier(.25, .7, .3, 1) forwards; }
.capa.derretido .queso-gotas { animation: quesoGotas 1.9s cubic-bezier(.3, .6, .3, 1) forwards, quesoOoze 5.5s ease-in-out 1.9s infinite; }
.capa.derretido-ya .queso-cuerpo { scale: 1.03 1; }
.capa.derretido-ya .queso-borde, .capa.derretido-ya .queso-brillo-img { scale: var(--qa) var(--qs); }
.capa.derretido-ya .queso-gotas { scale: var(--qa) var(--qy); translate: 0 3%; animation: quesoOoze 5.5s ease-in-out infinite; }
@keyframes quesoAncho { from { scale: 1 1; } to { scale: 1.03 1; } }
@keyframes quesoVence { from { scale: 1 1; } to { scale: var(--qa) var(--qs); } }
@keyframes quesoGotas { from { scale: 1 .6; translate: 0 0; } to { scale: var(--qa) var(--qy); translate: 0 3%; } }
@keyframes quesoOoze { 0%, 100% { scale: var(--qa) var(--qy); translate: 0 3%; } 50% { scale: calc(var(--qa) + .005) calc(var(--qy) + .08); translate: 0 3%; } }
/* gotas físicas */
.goteo { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: visible; }
.gota { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; will-change: translate, scale;
  border-radius: 50% 50% 50% 50% / 44% 44% 56% 56%;
  background: radial-gradient(ellipse 28% 22% at 36% 34%, rgba(255, 255, 250, .9), rgba(255, 255, 250, 0) 100%), radial-gradient(ellipse 62% 58% at 46% 56%, var(--c1), var(--c2) 52%, var(--c3) 100%);
  box-shadow: 0 1px 2px rgba(80, 40, 0, .25); }
.gota.f-lagrima { border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%; }
.gota.f-doble::after { content: ""; position: absolute; left: 22%; top: -46%; width: 56%; height: 52%; border-radius: 50%; background: inherit; }
.gota.yema { opacity: .96; background: radial-gradient(ellipse 26% 20% at 36% 32%, rgba(255, 246, 220, .95), rgba(255, 246, 220, 0) 100%), radial-gradient(ellipse 62% 58% at 46% 56%, var(--c1), var(--c2) 48%, var(--c3) 100%); }
.gota .hilo { position: absolute; left: 50%; bottom: 82%; translate: -50% 0; border-radius: 2px; background: linear-gradient(90deg, var(--c3), var(--c2) 45%, var(--c1) 55%, var(--c3)); }
@media (prefers-reduced-motion: reduce) { .goteo .gota:not(.yema) { display: none; } }
/* brillo que recorre la superficie (recortado a la elipse de arriba, sin máscaras de imagen) */
.queso-lustre { position: absolute; border-radius: 50%; overflow: hidden; pointer-events: none; mix-blend-mode: screen; }
.queso-lustre::before { content: ""; position: absolute; top: -10%; bottom: -10%; width: 22%; left: -30%; transform: skewX(-18deg);
  background: linear-gradient(90deg, transparent, rgba(255, 252, 238, .95) 45%, rgba(255, 255, 250, 1) 50%, rgba(255, 252, 238, .95) 55%, transparent); animation: lustre 4.6s ease-in-out infinite; }
.capa.derretido .queso-lustre::before { animation-delay: .4s; }
@keyframes lustre { 0%, 20% { translate: 0 0; opacity: 0; } 25% { opacity: .9; } 70% { opacity: .9; } 78%, 100% { translate: 560% 0; opacity: 0; } }
/* gotas: lágrima con un hilo fino que baja por el costado de la carne */
.gota-queso { position: absolute; width: calc(var(--u) * 10); height: calc(var(--u) * 52); margin-left: calc(var(--u) * -5); pointer-events: none; z-index: 3; opacity: 0; }
.gota-queso .hilo { position: absolute; left: 50%; top: 0; width: calc(var(--u) * 2.2); margin-left: calc(var(--u) * -1.1); height: calc(var(--u) * 36); border-radius: 2px;
  background: linear-gradient(90deg, #df8003, #fcb132 45%, #ffd27a 55%, #e88f0c); transform-origin: 50% 0; scale: 1 0; }
.gota-queso .lagrima { position: absolute; left: 0; top: 0; width: calc(var(--u) * 10); height: calc(var(--u) * 13); border-radius: 50% 50% 50% 50% / 38% 38% 62% 62%;
  background: radial-gradient(ellipse 30% 22% at 38% 40%, #fff3d0 0, rgba(255, 240, 200, 0) 100%), radial-gradient(ellipse 60% 55% at 45% 55%, #ffc24a, #f7a51e 55%, #d97c04 100%);
  box-shadow: 0 calc(var(--u) * 1.5) calc(var(--u) * 2) rgba(80, 40, 0, .25); }
.capa.derretido .gota-queso { animation: gotaCiclo var(--ciclo) ease-in calc(var(--d) + 3s) infinite; }
.capa.derretido .gota-queso .hilo { animation: hiloCiclo var(--ciclo) ease-in calc(var(--d) + 3s) infinite; }
.capa.derretido .gota-queso .lagrima { animation: lagrimaCiclo var(--ciclo) ease-in calc(var(--d) + 3s) infinite; }
.capa.derretido .gota-queso.intro { animation: gotaIntro 3.2s cubic-bezier(.45, .05, .55, .95) var(--d) 1 both, gotaCiclo var(--ciclo) ease-in calc(var(--d) + 6s) infinite; }
.capa.derretido .gota-queso.intro .hilo { animation: hiloIntro 3.2s cubic-bezier(.45, .05, .55, .95) var(--d) 1 both, hiloCiclo var(--ciclo) ease-in calc(var(--d) + 6s) infinite; }
.capa.derretido .gota-queso.intro .lagrima { animation: lagrimaIntro 3.2s cubic-bezier(.45, .05, .55, .95) var(--d) 1 both, lagrimaCiclo var(--ciclo) ease-in calc(var(--d) + 6s) infinite; }
.capa.derretido-ya .gota-queso { animation: gotaCiclo var(--ciclo) ease-in var(--d) infinite; }
.capa.derretido-ya .gota-queso .hilo { animation: hiloCiclo var(--ciclo) ease-in var(--d) infinite; }
.capa.derretido-ya .gota-queso .lagrima { animation: lagrimaCiclo var(--ciclo) ease-in var(--d) infinite; }
@keyframes gotaIntro { 0% { opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
@keyframes hiloIntro { 0%, 12% { scale: 1 0; } 85% { scale: 1 1; } 100% { scale: 1 1; } }
@keyframes lagrimaIntro { 0% { translate: 0 0; scale: .5 .5; } 12% { translate: 0 0; scale: .9 1; } 30% { scale: .85 1.15; } 85% { translate: 0 calc(var(--u) * 34); scale: .8 1.1; } 100% { translate: 0 calc(var(--u) * 38); scale: .7 1; } }
@keyframes gotaCiclo { 0%, 70% { opacity: 0; } 74% { opacity: 1; } 95% { opacity: .9; } 100% { opacity: 0; } }
@keyframes hiloCiclo { 0%, 74% { scale: 1 0; } 96% { scale: 1 1; } 100% { scale: 1 1; } }
@keyframes lagrimaCiclo { 0%, 70% { translate: 0 0; scale: .5 .5; } 74% { translate: 0 0; scale: .9 1; } 96% { translate: 0 calc(var(--u) * 34); scale: .8 1.1; } 100% { translate: 0 calc(var(--u) * 37); scale: .7 1; } }
.escenario .capa[data-tipo^="carne"] > .capa-img, .escenario .capa[data-tipo^="medallon"] > .capa-img { filter: contrast(1.06) saturate(1.12); }
.well .gota-queso, .well .queso-lustre { display: none; }
.pausa *, .pausa *::before, .pausa *::after, .pausa-doc .escenario *, .pausa-doc .escenario *::before { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) {

  .capa.derretido .queso-borde, .capa.derretido .queso-brillo-img { animation: none !important; scale: 1.05 1.12; }
}


.escenario .pila { transform-origin: 50% 100%; }

/* =========================================================
   PEDIDO
   ========================================================= */
.pedido { max-width: 72rem; margin: 0 auto; padding: 1.6rem 1.6rem 2.4rem; display: grid; grid-template-columns: minmax(0, 1fr) 21rem; gap: 1.6rem; align-items: start; }
.pedido .cabeza-cat { grid-column: 1 / -1; margin-bottom: 0; }
@media (orientation: portrait) { .pedido { grid-template-columns: 1fr; padding: 1.1rem 1rem 2rem; } }
.lineas { display: flex; flex-direction: column; gap: .7rem; }
.linea { display: grid; grid-template-columns: 7rem minmax(0, 1fr) auto; gap: 1rem; align-items: start; padding: .7rem; border-radius: 20px; background: #fff; box-shadow: var(--sombra), 0 0 0 1px var(--borde); animation: entra .35s var(--ease-suave) backwards; }
.linea .well { border-radius: 14px; }
.linea-nombre { font-family: var(--f-titulo); font-weight: 400; text-transform: uppercase; font-size: 1.35rem; line-height: 1; }

.linea-mods { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .4rem; }
.mod { font-size: .8rem; font-weight: 700; padding: .15rem .55rem; border-radius: 999px; }
.mod.sin { background: var(--rojo-velo); color: var(--rojo); }
.mod.mas { background: var(--verde-velo); color: var(--verde); }
.linea-acc { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-top: .7rem; }
.linea-precio { font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.link { min-height: 3rem; padding: 0 .9rem; border-radius: 999px; border: 1.5px solid var(--borde-2); background: #fff; font-weight: 700; display: inline-flex; align-items: center; gap: .35rem; }
.link.rojo { color: var(--rojo); border-color: #f0c6be; }
@media (max-width: 600px) { .linea { grid-template-columns: 4.8rem minmax(0, 1fr); gap: .7rem; } .linea-precio { grid-column: 2; } .linea-nombre { font-size: 1.1rem; } }
.resumen { position: sticky; top: calc(var(--cab-h) + 1rem); padding: 1.2rem; border-radius: 22px; background: var(--sup); display: flex; flex-direction: column; gap: .8rem; }
.resumen-fila { display: flex; justify-content: space-between; align-items: center; gap: .6rem; }
.resumen-total { font-family: var(--f-titulo); font-size: 2.2rem; line-height: 1; }
.resumen .serv { display: flex; align-items: center; gap: .6rem; padding: .6rem .8rem; border-radius: 14px; background: #fff; font-weight: 700; }
.resumen .serv svg { width: 2.4rem; height: 2.4rem; }
.nota { color: var(--tenue); font-size: .85rem; }
.vacio { text-align: center; padding: 2.5rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; color: var(--tinta-2); }
.vacio svg { width: 9rem; height: 9rem; }
.sugs { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: .6rem; }
@media (max-width: 600px) { .sugs { grid-template-columns: repeat(2, 1fr); } }

/* =========================================================
   PAGO
   ========================================================= */
.pago { max-width: 64rem; margin: 0 auto; padding: 2rem 1.6rem 2.4rem; text-align: center; }
.pago-total { margin: .6rem 0 1.6rem; }
.pago-total span { display: block; color: var(--tenue); font-family: var(--f-cond); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
.pago-total b { font-family: var(--f-titulo); font-weight: 400; font-size: 3.6rem; line-height: 1; }
.medios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
@media (orientation: portrait) { .medios { grid-template-columns: 1fr; } }
.medio {
  display: flex; flex-direction: column; align-items: center; gap: .4rem; padding: 1.4rem 1rem 1.5rem; border-radius: 24px;
  border: 2px solid var(--borde); background: #fff; box-shadow: var(--sombra); transition: transform .3s var(--ease-resorte), border-color .2s, background-color .2s;
}
.medio:hover { border-color: var(--acento); background: var(--acento-velo); }
.medio:active { transform: scale(.97); }
.medio svg { width: 7rem; height: 7rem; }
.medio > span { display: flex; flex-direction: column; align-items: center; gap: .25rem; }
.medio b { font-family: var(--f-titulo); font-weight: 400; text-transform: uppercase; font-size: 1.6rem; line-height: 1; }
.medio small { color: var(--tenue); }
@media (orientation: portrait) { .medio { flex-direction: row; text-align: left; padding: 1rem 1.2rem; gap: 1rem; } .medio svg { width: 4.6rem; height: 4.6rem; flex: none; } .medio > span { display: flex; flex-direction: column; align-items: flex-start; gap: .2rem; } }
.proceso { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 1rem 0; }
.proceso .arte { width: min(22rem, 70vw); height: min(16rem, 52vw); }
.proceso .qr { width: min(17rem, 64vw); height: auto; border-radius: 18px; box-shadow: var(--sombra-2); }
.proceso h2 { font-family: var(--f-titulo); font-weight: 400; text-transform: uppercase; font-size: 2.2rem; line-height: 1; }
.proceso p { color: var(--tinta-2); max-width: 40ch; }
.espera { display: inline-flex; align-items: center; gap: .6rem; font-weight: 700; color: var(--tinta-2); }
.espera::before { content: ""; width: 1.3rem; height: 1.3rem; border-radius: 50%; border: 3px solid var(--borde-2); border-top-color: var(--acento-osc); animation: gira .9s linear infinite; }
@keyframes gira { to { transform: rotate(1turn); } }
.tarjeta-anim { animation: acerca 2.2s var(--ease-suave) infinite; transform-origin: 50% 50%; }
@keyframes acerca { 0%, 100% { transform: translate(28px, -26px) rotate(-14deg); } 45%, 60% { transform: translate(0, 0) rotate(-4deg); } }
.ondas path { animation: ondas 2.2s ease-out infinite; opacity: 0; }
.ondas path:nth-child(2) { animation-delay: .2s; }
.ondas path:nth-child(3) { animation-delay: .4s; }
@keyframes ondas { 45% { opacity: 0; } 55% { opacity: 1; } 100% { opacity: 0; } }

/* =========================================================
   FIN
   ========================================================= */
.fin { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 2rem 1.4rem; text-align: center; background: radial-gradient(ellipse 60% 50% at 50% 35%, #fff3d6, #fff 70%); }
.fin .ini-insignia { width: 6.5rem; height: 6.5rem; }
.check { width: 5.5rem; height: 5.5rem; }
.check circle { fill: var(--verde); transform-origin: center; animation: pop .5s var(--ease-resorte) both; }
.check path { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: tilde .5s .35s ease-out forwards; }
@keyframes tilde { to { stroke-dashoffset: 0; } }
.fin h1 { font-family: var(--f-titulo); font-weight: 400; text-transform: uppercase; font-size: 3.4rem; line-height: 1; }
.fin-num { display: flex; flex-direction: column; align-items: center; padding: 1rem 2.4rem 1.2rem; border-radius: 26px; background: var(--oscuro); color: #fff; }
.fin-num span { font-family: var(--f-cond); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: #d9d1c3; }
.fin-num b { font-family: var(--f-titulo); font-weight: 400; font-size: 6.5rem; line-height: 1; color: var(--acento); letter-spacing: .03em; }
.fin p { color: var(--tinta-2); max-width: 36ch; font-size: 1.1rem; }
.fin .serv-chip { display: inline-flex; align-items: center; gap: .5rem; font-weight: 700; padding: .4rem 1rem; border-radius: 999px; background: var(--sup); }
.fin .serv-chip svg { width: 2rem; height: 2rem; }
.cuenta { display: flex; align-items: center; gap: .6rem; color: var(--tenue); font-weight: 600; }
.cuenta svg { width: 2.2rem; height: 2.2rem; transform: rotate(-90deg); }
.cuenta circle { fill: none; stroke-width: 4; }
.cuenta .c-fondo { stroke: var(--borde); }
.cuenta .c-arco { stroke: var(--acento-osc); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.confeti { position: fixed; inset: 0; pointer-events: none; z-index: 99; overflow: hidden; }
.confeti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: cae 2.4s cubic-bezier(.3, .6, .4, 1) forwards; }
@keyframes cae { to { transform: translate(var(--dx), 105vh) rotate(var(--rot)); } }

/* =========================================================
   BARRA DE PEDIDO
   ========================================================= */
.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; height: var(--barra-h);
  background: #fff; border-top: 1px solid var(--borde); box-shadow: 0 -10px 30px rgba(40, 25, 10, .08);
  padding-bottom: env(safe-area-inset-bottom);
}

.badge.salto { animation: salto .55s var(--ease-resorte); }
@keyframes salto { 35% { transform: scale(1.7); } }
.barra-bolsa.recibe { animation: recibe .5s var(--ease-resorte); }
@keyframes recibe { 40% { transform: scale(1.15); background: var(--acento-velo); } }
.barra-info { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.barra-n { color: var(--tenue); font-size: .9rem; font-weight: 600; white-space: nowrap; }
.barra-total { font-family: var(--f-titulo); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.barra-total.cambia { animation: cambia .5s var(--ease-resorte); }
@keyframes cambia { 40% { transform: scale(1.12); color: var(--acento-osc); } }
.barra-item { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; min-width: 0; }
.barra-item span { color: var(--tenue); font-size: .9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16rem; }
.barra-item b { font-family: var(--f-titulo); font-weight: 400; font-size: 1.9rem; line-height: 1; }
@media (max-width: 600px) {
  .barra-in { gap: .5rem; padding: 0 .7rem; }
  .barra .ver, .barra .btn .txt-largo { display: none; }
  .barra-bolsa { width: 3.2rem; height: 3.2rem; }
  .barra-total, .barra-item b { font-size: 1.45rem; }
  .barra-n, .barra-item span { font-size: .78rem; }
  .barra .btn-xl { padding: 0 1.1rem; font-size: 1.1rem; }
  .barra .btn-sec { padding: 0 .9rem; }
  .barra .solo-ancho { display: none; }
}

/* =========================================================
   MODAL, TOAST, VUELO
   ========================================================= */
.modal { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 1rem; background: rgba(22, 16, 10, .55); opacity: 0; transition: opacity .25s; }
.modal.visible { opacity: 1; }
.modal-caja {
  width: min(48rem, 100%); max-height: calc(100dvh - 2rem); overflow-y: auto; border-radius: 28px; background: #fff;

/* huecos del combo: lo que falta elegir, punteado en su lugar del escenario; al tocarlo, el panel va a esa sección */

.ce-hueco:focus-visible { outline: 2px dashed var(--foco); outline-offset: 2px; }
.ce-vacio figcaption { color: var(--tenue) !important; }
.ce-vacio svg g { animation: huecoLate 2.4s ease-in-out infinite; }
@keyframes huecoAparece { from { opacity: 0; scale: .9; } to { opacity: 1; scale: 1; } }
@keyframes huecoLate { 50% { stroke-opacity: .4; } }

.esc-titulo { right: 1.3rem; }
.burger { cursor: pointer; }
/* la pila es su propio contexto de apilado: así side y bebida (.ce) quedan delante de la burger */

/* la burger va ADELANTE: side y bebida (y sus huecos) quedan detrás; en el combo sólo la pila toma el toque, así los huecos siguen tocables */

.esc-col.con-combo #burger .pila { pointer-events: auto; }

<script>
window.__errores = [];
function __anotar(m) { window.__errores.push(m); document.documentElement.setAttribute('data-errores', window.__errores.join(' | ')); }

/* =====================================================================
   ORIENTACIÓN: vertical (totem 9:16, por defecto) u horizontal.
   En vertical sobre una pantalla apaisada, la página muestra un totem con un iframe de esta misma página
   a 1080x1920 reales escalado con transform: adentro todo (transiciones, FLIP, vuelo al carrito) trabaja en
   coordenadas nativas, sin cuentas de escala. ?orientacion=vertical|horizontal  (se recuerda en localStorage)
   ===================================================================== */
(function () {
  const q = new URLSearchParams(location.search);
  const CLAVE = 'weiss-orientacion';
  const leer = () => { try { return localStorage.getItem(CLAVE); } catch (e) { return null; } };
  const guardar = (v) => { try { localStorage.setItem(CLAVE, v); } catch (e) { /* sin storage */ } };
  const pedida = q.get('orientacion');
  if (pedida === 'vertical' || pedida === 'horizontal') guardar(pedida);
  const ori = pedida || leer() || 'vertical';
  const enMarco = q.has('marco');
  window.__ORIENTACION = enMarco ? 'vertical' : ori;
  window.__EN_MARCO = enMarco;
  /* cambiar: siempre recarga a la URL con el estado actual que arma la app */
  window.__cambiarOrientacion = (v, urlEstado) => {
    if (enMarco) { parent.postMessage({ weiss: 'orientacion', v, url: urlEstado }, '*'); return; }
    guardar(v);
    const u = new URL(urlEstado || location.href, location.href);
    u.searchParams.delete('marco'); u.searchParams.set('orientacion', v);
    location.href = u.href;
  };
  const apaisada = () => !matchMedia('(orientation: portrait)').matches;
  const tactil = matchMedia('(pointer: coarse)').matches || (navigator.maxTouchPoints > 0 && matchMedia('(hover: none)').matches);
  window.__TACTIL = tactil;
  if (tactil && !enMarco) window.__ORIENTACION = 'auto';
  if (enMarco || tactil || ori !== 'vertical' || !apaisada()) return;
  /* montar el totem */
  window.__MARCO = true;
  document.documentElement.classList.add('en-marco');
  const u = new URL(location.href); u.searchParams.delete('orientacion'); u.searchParams.set('marco', '1');
  const totem = document.createElement('div');
  totem.id = 'totem';
  totem.innerHTML = `
    <div class="totem-cuerpo"><div class="totem-bisel"><div class="totem-pantalla"><iframe id="totem-iframe" title="Weiss · autoservicio" src="${u.href}"></iframe></div><div class="totem-menton"><img src="img/logo-weiss.png" alt="" width="40" height="42"></div></div><div class="totem-pie"></div></div>`;
  const montar = () => {
    document.body.appendChild(totem);
    const ajustar = () => {
      const H = Math.max(320, innerHeight - 24 - 36 - 40);   /* margen + mentón + pie */
      const k = H / 1920;
      document.documentElement.style.setProperty('--tk', k);
      document.documentElement.style.setProperty('--tw', (1080 * k) + 'px');
      document.documentElement.style.setProperty('--th', H + 'px');
    };
    ajustar(); addEventListener('resize', ajustar);
  };
  addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.weiss === 'estado') window.__ultimoEstado = d.url;
    if (d.weiss === 'orientacion') { window.__cambiarOrientacion(d.v, d.url); }
  });
  if (document.body) montar(); else addEventListener('DOMContentLoaded', montar);
})();

  f += `<feDiffuseLighting in="grano" surfaceScale="${N1(o.relieve * SUAVE)}" diffuseConstant="${N1(gan * 100) / 100}" lighting-color="${o.colorLuz ?? '#fff3e2'}" result="luz"><feDistantLight azimuth="${az}" elevation="${el}"/></feDiffuseLighting>`;
  f += `<feBlend in="forma" in2="luz" mode="multiply" result="m"/><feComposite in="m" in2="forma" operator="in" result="tex"/>`;
  if (o.brillo) f += `<feSpecularLighting in="grano" surfaceScale="${N1(o.relieve * SUAVE)}" specularConstant="${o.brillo}" specularExponent="${o.exp ?? 20}" lighting-color="${o.colorBrillo ?? '#fff3dc'}" result="esp"><feDistantLight azimuth="${az}" elevation="${o.elB ?? 38}"/></feSpecularLighting><feComposite in="esp" in2="forma" operator="in" result="espIn"/><feComposite in="tex" in2="espIn" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>`;
  return f + '</filter>';
}
/* manchas: poros, quemado, vetas (ruido umbralizado y teñido, recortado a la forma) */
function filtroManchas(id, o, seed) {
  return `<filter id="${id}" x="-5%" y="-40%" width="110%" height="180%" color-interpolation-filters="sRGB">` +

    `<feFlood flood-color="${o.color}" flood-opacity="${o.op ?? .5}"/><feComposite in2="a" operator="in" result="c"/>` +
    `<feComposite in="c" in2="SourceAlpha" operator="in" result="ci"/>` +
    `<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="ci"/></feMerge></filter>`;
}

/* contexto de dibujo por (tipo, variante): registra gradientes y filtros en <defs> */
function crearCtx(tipo, v) {
  const pref = `c-${tipo}-${v}`;
  const r = rng(hash(tipo) + v * 7919);
  let k = 0;
  const defs = [];
  const id = () => `${pref}-${k++}`;
  const stops = (st) => st.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a != null ? ` stop-opacity="${a}"` : ''}/>`).join('');
  return {
    r, v, defs,
    lin(st, x1, y1, x2, y2) { const i = id(); defs.push(`<linearGradient id="${i}" gradientUnits="userSpaceOnUse" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops(st)}</linearGradient>`); return `url(#${i})`; },
    linBox(st, x2 = 0, y2 = 1) { const i = id(); defs.push(`<linearGradient id="${i}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops(st)}</linearGradient>`); return `url(#${i})`; },
    rad(st, cx, cy, rr, sy = 1) { const i = id(); defs.push(`<radialGradient id="${i}" gradientUnits="userSpaceOnUse" cx="${cx}" cy="${cy}" r="${rr}" gradientTransform="translate(${cx} ${cy}) scale(1 ${sy}) translate(${-cx} ${-cy})">${stops(st)}</radialGradient>`); return `url(#${i})`; },
    radBox(st, fx = .5, fy = .5) { const i = id(); defs.push(`<radialGradient id="${i}" cx=".5" cy=".5" r=".5" fx="${fx}" fy="${fy}">${stops(st)}</radialGradient>`); return `url(#${i})`; },
    sup(o) { const i = id(); defs.push(filtroSup(i, o, Math.floor(r() * 900) + 1)); return `url(#${i})`; },
    manchas(o) { const i = id(); defs.push(filtroManchas(i, o, Math.floor(r() * 900) + 1)); return `url(#${i})`; },
    clip(d) { const i = id(); defs.push(`<clipPath id="${i}"><path d="${d}"/></clipPath>`); return `url(#${i})`; },
  };
}

/* =====================================================================
   3. INGREDIENTES (un generador por tipo de capa)
   Coordenadas: cada capa mide 300 de ancho (el diámetro de la burger) y "vh" de alto.
   El plano de apoyo es una elipse de radio ~135 x 13 (cámara casi de costado).
   ===================================================================== */
const PAN = ['#f8cf8c', '#eba650', '#cc7a2b', '#9c5017', '#5f2b0b', '#f3c98b'];
const PAN_LISO = ['#f6c47a', '#e49641', '#c26f24', '#8f4513', '#55250a', '#f0c27f'];
const PAN_TACC = ['#f1dcae', '#e2bd7f', '#c99b5a', '#a77538', '#6f4a22', '#f3e1b8'];
const PAN_NEGRO = ['#55505c', '#34303a', '#24212a', '#17151b', '#0b0a0d', '#46414d'];

function panSup(c, o) {
  const { r } = c;
  const B = o.base, H = o.domo, rx = o.rx || 133, pot = o.pot || .5, P = o.paleta;
  const w = onda(r, [3, 5, 8, 13], [1, .5, .3, .2]);
  const p = [], n = 44;
  for (let k = 0; k <= n; k++) {
    const t = Math.PI + Math.PI * k / n, s = Math.abs(Math.sin(t));
    p.push([150 + rx * (1 + .006 * w(t)) * Math.cos(t), B - H * Math.pow(s, pot) * (1 + .02 * w(t * 1.7))]);
  }
  for (let k = 2; k < n - 1; k += 2) { const t = Math.PI * k / n; p.push([150 + (rx - 3) * Math.cos(t), B + 12 * Math.sin(t)]); }
  const d = curva(p);
  const cuerpo = c.rad([[0, P[0]], [.22, P[1]], [.5, P[2]], [.8, P[3]], [1, P[4]]], 116, B - H * .92, 205, .6);
  const banda = c.lin([[0, P[5], 0], [.45, P[5], .65], [.75, P[5], .7], [1, '#3a1a06', .8]], 0, B - 20, 0, B + 13);
  const lados = c.lin([[0, '#2a0f02', .6], [.14, '#2a0f02', 0], [.86, '#2a0f02', 0], [1, '#2a0f02', .65]], 150 - rx, 0, 150 + rx, 0);
  const fil = c.sup({ borde: 2, bordeFrec: .05, frec: o.frec || '.035 .06', oct: 2, relieve: o.relieve || 2.2, el: 55, brillo: o.brillo ?? .5, exp: 34, colorBrillo: '#fff0d2' });
  const miga = c.manchas({ frec: o.poros || '.8 1.1', color: '#5a2a08', op: o.porosOp ?? .1, k: 3, t: 1.65 });
  let s = `<g filter="${fil}"><g filter="${miga}"><path d="${d}" fill="${cuerpo}"/><path d="${d}" fill="${banda}"/><path d="${d}" fill="${lados}"/></g></g>`;
  /* brillo de manteca */
  s += `<ellipse cx="110" cy="${N1(B - H * .8)}" rx="46" ry="${N1(H * .14)}" fill="#fff4dc" opacity="${o.luz ?? .32}" filter="url(#f-blur6)" transform="rotate(-10 110 ${N1(B - H * .8)})"/>`;
  if (o.grietas) {
    let g = '';
    for (let i = 0; i < 5; i++) {
      const x = 70 + r() * 160, y = B - H * (.45 + r() * .4), L = 18 + r() * 26, pts = [];
      for (let j = 0; j <= 5; j++) pts.push([x - L / 2 + L * j / 5, y + (r() - .5) * 3]);
      const dd = curva(pts, false);
      g += `<path d="${dd}" stroke="#f9ecd0" stroke-width="2.4" opacity=".55"/><path d="${dd}" stroke="#9a6a35" stroke-width="1.1"/>`;
    }
    s += `<g fill="none" stroke-linecap="round">${g}</g>`;
  }
  if (o.semillas) {
    const arr = [];
    for (let i = 0; i < 64; i++) {
      const u = (r() * 2 - 1) * .9;
      const hl = H * Math.pow(Math.sqrt(1 - u * u), pot);
      const vv = .22 + Math.pow(r(), .65) * .74;
      arr.push([150 + rx * u, B - hl * vv, .5 + .5 * Math.sqrt(1 - u * u), (r() - .5) * 120 + u * 40, vv]);
    }
    arr.sort((a, b) => a[1] - b[1]);
    s += `<g filter="url(#f-semilla)">${arr.map(([x, y, e, a, vv]) => `<ellipse cx="${N1(x)}" cy="${N1(y)}" rx="${N1(3.2 * e)}" ry="${N1(1.7 - vv * .5)}" transform="rotate(${N1(a)} ${N1(x)} ${N1(y)})" fill="url(#g-semilla)"/>`).join('')}</g>`;
  }
  return s;
}

function panInf(c, o) {

  const lado = c.lin([[0, P[5]], [.28, P[5]], [.4, P[1]], [.62, P[2]], [.85, P[3]], [1, P[4]]], 0, 3, 0, cy + alto + 13);

function carne(c, o = {}) {
  const r = c.r;
  const P = o.paleta || ['#8b5434', '#64331a', '#4c2411', '#321508', '#1b0a03'];
  const T = o.tapa || ['#8a5533', '#673820', '#45220f'];
  const cy = 14, rx = o.rx || 137, ry = 12.5, alto = 22;
  const d = losa(150, cy, rx, ry, alto, { amp: o.amp ?? .03, r, fr: [4, 7, 12, 19], am: [1, .8, .6, .5], n: 46, ryB: 12.5 });
  const lado = c.lin([[0, P[0]], [.25, P[1]], [.5, P[2]], [.78, P[3]], [1, P[4]]], 0, 2, 0, cy + alto + 13);
  const lados = c.lin([[0, '#000', .55], [.1, '#000', 0], [.9, '#000', 0], [1, '#000', .6]], 13, 0, 287, 0);
  const tapa = c.rad([[0, T[0]], [.7, T[1]], [1, T[2]]], 135, cy - 3, rx, .1);
  let encaje = '';
  if (!o.liso) {
    for (let i = 0; i < 26; i++) {
      const lado = r() < .5 ? -1 : 1;
      let x, y;
      if (i < 14) { x = 150 + lado * (rx - 5 + r() * 9); y = cy + r() * (alto + 6); }
      else { x = 28 + r() * 244; y = cy + alto + 9 + r() * 4 - Math.abs(x - 150) / 30; }
      encaje += `<path d="${elipse(x, y, 2 + r() * 4.5, 1.4 + r() * 2.5, { amp: .35, r, n: 10 })}" fill="${['#241006', '#3b1a0b', '#52290f'][i % 3]}"/>`;
    }
  }
  let extra = '';
  if (o.marcas) {
    const cl = c.clip(d);
    let m = '';
    for (let i = 0; i < 9; i++) { const x = 18 + i * 33; m += `<path d="M${x} ${cy - 14}L${x + 22} ${cy + alto + 16}" />`; }
    extra += `<g clip-path="${cl}" stroke="#140602" stroke-width="5" opacity=".55" filter="url(#f-blur1)" fill="none">${m}</g>`;
  }
  if (o.cebolla) {
    let h = '';
    for (let i = 0; i < 70; i++) {
      const [x, y] = enElipse(r, 150, cy - 1, rx - 14, ry - 2);
      const L = 10 + r() * 22, a = (r() - .5) * .5, b = (r() - .5) * 10;
      const ca = Math.cos(a), sa = Math.sin(a);
      h += `<path d="M${N1(x - ca * L / 2)} ${N1(y - sa * L / 2)}Q${N1(x - sa * b * .3)} ${N1(y + b * .3)} ${N1(x + ca * L / 2)} ${N1(y + sa * L / 2)}" stroke="${['#f0cd88', '#d9a35a', '#b8722f', '#7a3d14', '#e7bb72'][i % 5]}" stroke-width="${N1(1 + r() * 1.3)}"/>`;
    }
    for (let i = 0; i < 18; i++) {   /* hebras pegadas al costado */
      const x = 30 + r() * 240, y = cy + 6 + r() * 10, L = 6 + r() * 12;
      h += `<path d="M${N1(x)} ${N1(y)}q${N1(L / 2)} ${N1(2 + r() * 3)} ${N1(L)} ${N1((r() - .5) * 4)}" stroke="${['#c88a45', '#8a4a1a', '#e2ad62'][i % 3]}" stroke-width="1.2"/>`;
    }
    extra += `<g fill="none" stroke-linecap="round" opacity=".95">${h}</g>`;
  }
  const fil = c.sup({ borde: o.liso ? 3 : 5, bordeFrec: .08, frec: o.frec || '.16 .28', oct: 3, relieve: o.relieve || 2.4, el: 58, brillo: o.brillo ?? .85, exp: 15, colorBrillo: '#ffcf9e', ganancia: 1.2 });
  const quemado = c.manchas({ frec: '.11 .28', color: '#100401', op: .42, k: 3.2, t: 1.8 });
  return `<g filter="${fil}"><g filter="${quemado}"><path d="${d}" fill="${lado}"/><path d="${elipse(150, cy, rx - 5, ry - 1.3, { amp: .02, r, n: 30 })}" fill="${tapa}"/><path d="${d}" fill="${lados}"/>${encaje}${extra}</g></g>`;
}

function quesoLamina(c, o) {
  const r = c.r, C = o.colores;

  if (o.frente) gotas.push({ c: 140 + r() * 30, a: 16, L: o.largo * 1.1 });

function quesoAzul(c) {

function brie(c) {

function bacon(c) {
  const r = c.r;

  const vetas = c.manchas({ frec: '.012 .32', oct: 2, color: '#f3cfa6', op: .95, k: 5, t: 2.55 });
  const vetas2 = c.manchas({ frec: '.02 .5', oct: 2, color: '#3b0e04', op: .7, k: 5, t: 2.7 });

  for (const t of tiras) {

function rucula(c) {

      const t = k / 12;
      const hw = W * Math.pow(Math.sin(Math.PI * Math.min(t * 1.05, 1)), .7) * (1 + .5 * Math.max(0, Math.sin(t * Math.PI * 2 * lob))) * (t > .7 ? 1.3 : 1);

  const n = P.n;

    cuerpos.push(crearCuerpo(el, { dy: m.untar ? 0 : -(alto + i * 4), D: m.untar ? 0 : D, delay: m.untar ? aterriza - 60 : aterriza - D, abajo, r, aparece: true, G, alAterrizar: i === 0 ? () => apretar(esc) : null,
      alTerminar: () => { if (--pendientes === 0) alFinal && alFinal(); } }));
  }
  const t0 = D + (n - 1) * INTERVALO;
  const pila = esc.querySelector('.pila');
  try { pila.animate([{ opacity: 0, scale: '.4 .6' }, { opacity: 1, scale: '1 1' }], { duration: 600, fill: 'backwards', pseudoElement: '::after', easing: 'ease-out' }); } catch (e) { /* sin soporte */ }
  return t0 + 900;
}
/* armar: cada capa baja desde donde está (desarmada) con su física; el pan de arriba se apoya último */
function armarConFisica(esc) {
  window.__aterrizajes = [];
  const capas = [...esc.querySelectorAll('.capa')];
  const n = capas.length;
  const antes = capas.map((el) => el.getBoundingClientRect().top);
  esc.classList.add('sin-trans');
  esc.classList.remove('abierta', 'quieta');
  void esc.offsetWidth;
  const despues = capas.map((el) => el.getBoundingClientRect().top);
  esc.classList.remove('sin-trans');
  const r = rng(hash(capas.map((c) => c.dataset.tipo).join()) + 11);
  const G = 3600 * Math.max(.6, (esc.getBoundingClientRect().height || 600) / 900);
  const cuerpos = [];
  const D = 420, INTERVALO = 90;
  /* la pila entera se re-centra suave mientras cada capa cae sobre la de abajo (relativo al pan de abajo, que no rebota) */
  const base = antes[n - 1] - despues[n - 1];
  const total = D + (n - 1) * INTERVALO;
  const pila = esc.querySelector('.pila');
  if (Math.abs(base) > 1) pila.animate([{ translate: `0 ${base}px` }, { translate: '0 0' }], { duration: total, easing: 'cubic-bezier(.45, 0, .3, 1)', composite: 'add' });
  for (let k = 0; k < n; k++) {
    const i = n - 1 - k, dy = (antes[i] - despues[i]) - base;
    const aterriza = D + k * INTERVALO;
    const cae = dy < -1;
    cuerpos.push(crearCuerpo(capas[i], { dy: cae ? dy : 0, D: cae ? D : 0, delay: cae ? aterriza - D : 0, abajo: cuerpos.slice().reverse(), r, G, alAterrizar: k === n - 1 ? () => apretar(esc) : null }));
  }
}
/* tras sacar o sumar una capa: las de arriba caen al hueco con su física; las empujadas suben con resorte */
function acomodarConFisica(esc, viejos) {
  window.__aterrizajes = [];
  const capas = [...esc.querySelectorAll('.capa')];
  const G = 3600 * Math.max(.6, (esc.getBoundingClientRect().height || 600) / 900);
  const cuerpos = [];
  const Hh = esc.getBoundingClientRect().height;
  const D = 420, INTERVALO = 110;
  let k = 0;
  for (let i = capas.length - 1; i >= 0; i--) {
    const el = capas[i], key = el.dataset.key;
    const abajo = cuerpos.slice().reverse();
    const nueva = !viejos.has(key);
    const dy = nueva ? -Math.min(240, Hh * .3) : viejos.get(key) - el.getBoundingClientRect().top;
    if (Math.abs(dy) <= 1) continue;
    /* lo nuevo entra deslizándose de costado a su lugar, con su z de la pila (detrás de lo que tiene encima);
       caer desde arriba lo haría pasar por delante/encima del pan de arriba */
    if (nueva) {
      el.animate([{ translate: '62% 0', opacity: 0 }, { opacity: 1, offset: .35 }, { translate: '-3% 0', offset: .78 }, { translate: '0 0', opacity: 1 }], { duration: 640, delay: 80, easing: 'cubic-bezier(.25, .8, .35, 1)', fill: 'backwards' });
      continue;
    }
    if (nueva) el.classList.add('cayendo');
    if (dy < 0) { cuerpos.push(crearCuerpo(el, { dy, D, delay: k * INTERVALO, abajo, aparece: nueva, G })); k++; }
    else cuerpos.push(crearCuerpo(el, { dy, delay: 0, abajo, G }));
  }
}

/* =====================================================================
   TRANSICIONES: el elemento tocado se transforma en su lugar de la pantalla siguiente.
   View Transitions API si existe; si no, FLIP a mano (getBoundingClientRect + transform).

  pares = pares.filter((p) => p.de && p.de.isConnected);

    if (VT_OK) {
      document.documentElement.classList.add('vt-rapida');
      const v = document.startViewTransition(actualizar);
      return v.finished.finally(() => document.documentElement.classList.remove('vt-rapida'));
    }
    actualizar(); return Promise.resolve();
  }
  if (VT_OK) {
    if (vtActual) { try { vtActual.skipTransition(); } catch (e) { /* */ } }
    pares.forEach((p) => { p.de.style.viewTransitionName = p.nombre; });
    let destinos = [];

      pares.forEach((p) => { p.de.style.viewTransitionName = ''; });
      actualizar();

      destinos = pares.map((p) => { const d = p.a && p.a(); if (!d || usados.has(d)) return null; usados.add(d); d.style.viewTransitionName = p.nombre; return d; });
    });
    vtActual = v;
    const fin = () => { destinos.forEach((d) => d && (d.style.viewTransitionName = '')); if (vtActual === v) vtActual = null; };
    return v.finished.then(fin, fin);
  }
  /* respaldo: FLIP del elemento compartido + fundido suave de la pantalla */
  const desde = pares.map((p) => p.de.getBoundingClientRect());
  actualizar();
  pares.forEach((p, i) => {
    const d = p.a && p.a(); if (!d) return;
    const r0 = desde[i], r1 = d.getBoundingClientRect();
    if (!r1.width || !r1.height) return;
    d.animate([
      { transform: `translate(${r0.left - r1.left}px, ${r0.top - r1.top}px) scale(${r0.width / r1.width}, ${r0.height / r1.height})`, transformOrigin: '0 0' },

function volar(desde, contenido, bw) {
  const dest = $('#barra-bolsa');
  if (!dest || reducido() || !desde.width) { saltarBadge(); return Promise.resolve(); }
  const d = dest.getBoundingClientRect();
  const g = document.createElement('div'); g.className = 'vuelo'; g.innerHTML = contenido;
  Object.assign(g.style, { left: desde.left + 'px', top: desde.top + 'px', width: desde.width + 'px', height: desde.height + 'px' });
  if (bw) g.style.setProperty('--bw', bw + 'px');
  document.body.appendChild(g); volcarDefs();
  const dx = d.left + d.width / 2 - (desde.left + desde.width / 2), dy = d.top + d.height / 2 - (desde.top + desde.height / 2);
  const s = Math.max(.06, 46 / Math.max(desde.width, desde.height));
  const a = g.animate([
    { transform: 'translate(0, 0) scale(1) rotate(0deg)', opacity: 1 },
    { transform: `translate(${dx * .45}px, ${dy * .45 - 150}px) scale(${(1 + s) / 2 + .05}) rotate(-8deg)`, opacity: 1, offset: .45 },
    { transform: `translate(${dx}px, ${dy}px) scale(${s}) rotate(4deg)`, opacity: .5 },
  ], { duration: 820, easing: 'cubic-bezier(.45, .05, .3, 1)' });
  return a.finished.then(() => { g.remove(); saltarBadge(); });
}
