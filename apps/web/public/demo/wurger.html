      break;
    }
    case 'combo-elegir': estado.modoPreset = id; estado.cat = 'burgers'; renderMenu(true); window.scrollTo(0, 0); break;
    case 'preset-quitar': estado.modoPreset = null; renderMenu(); break;
    case 'burger': { const bn = el.closest('.hw-banner, .big-banner'); abrirDetalle(id, null, null, mediaDe(el) || (bn && bn.querySelector('.hw-burger .pila'))); break; }
    case 'add': quickAdd(el.dataset.tipo, id, el); if (modalTipo === 'upsell') renderUpsell(); break;
    case 'ens': abrirEnsalada(id); break;
    case 'ens-pollo': estado.ens.pollo = v; abrirEnsalada(estado.ens.id); break;
    case 'ens-add': {
      const E = estado.ens, well = $('#modal-caja .well');
      const r = well.getBoundingClientRect(), html = well.innerHTML;
      const l = sumarLinea({ tipo: 'ensalada', id: E.id, pollo: E.pollo, combo: v === '1', cant: 1 });
      cerrarModal(); renderTodo(); toast(t('toast.agregado', { x: describir(l).nombre })); volar(r, html);
      break;
    }
    case 'paso': cambiarPaso(Number(el.dataset.i)); break;
    case 'siguiente': siguienteDetalle(); break;
    case 'armar-combo': irAComboArmar(); break;
    case 'combo-volver': cambiarPaso(2); break;
    case 'subpaso': irASeccion(el.dataset.v); break;
    case 'sin': {
      const g = el.dataset.grupo, quitar = !cfg.sin.includes(g);
      const esc = $('#escenario');
      const capasG = [...esc.querySelectorAll('.capa')].filter((c) => { const b = burgerDe(cfg.slug); const base = capasBase(b).find((x) => x.key === c.dataset.key); return base && base.grupo === g; });
      if (quitar) {
        cfg.sin.push(g);
        if (!reducido() && capasG.length && estado.abierta && !estado.foto) {
          /* la capa se levanta y sale de costado; después las otras cierran el hueco */
          capasG.forEach((c, k) => {
            const lado = c.classList.contains('izq') ? -1 : 1;
            const pm = materialDe(c.dataset.tipo).pesado || 1, alto = 46 / Math.sqrt(pm), dur = 380 + pm * 120;
            c.animate([{ translate: '0 0', opacity: 1, rotate: '0deg' }, { translate: `${lado * 22}px ${-alto}px`, opacity: 1, rotate: `${lado * (6 / pm)}deg`, offset: .32, easing: 'cubic-bezier(.3, 0, .6, 1)' }, { translate: `${lado * 260}px ${pm > 1.2 ? 30 : -16}px`, opacity: 0, rotate: `${lado * (14 / pm)}deg` }], { duration: dur, delay: k * 50, easing: 'cubic-bezier(.4, 0, .7, .2)', fill: 'forwards', composite: 'add' });
          });
          renderPanel(); renderBarra();
          setTimeout(() => { if (estado.cfg === cfg) { renderEscenario(true); renderBarra(); } }, 400 + capasG.length * 50);
          break;
        }
      } else cfg.sin.splice(cfg.sin.indexOf(g), 1);
      renderEscenario(true); renderPanel(); renderBarra();
      break;
    }
    case 'agr': {
      const a = AGREGADOS.find((x) => x.id === id), d = Number(el.dataset.d);
      cfg.agr[id] = Math.max(0, Math.min(a.max, (cfg.agr[id] || 0) + d));
      if (d < 0 && !reducido() && estado.abierta && !estado.foto) {
        const c = $(`#escenario .capa[data-key="x-${id}-${cfg.agr[id]}"]`);
        if (c) {
          const lado = c.classList.contains('izq') ? -1 : 1;
          c.animate([{ translate: '0 0', opacity: 1 }, { translate: `${lado * 240}px -20px`, opacity: 0 }], { duration: 360, easing: 'cubic-bezier(.4, 0, .7, .2)', fill: 'forwards', composite: 'add' });
          renderPanel(); renderBarra();
          setTimeout(() => { if (estado.cfg === cfg) renderEscenario(true); }, 340);
          $(`[data-acc="agr"][data-id="${id}"][data-d="${d}"]`)?.focus();
          break;
        }
      }
      if (d > 0 && !estado.abierta && !compacto()) { estado.abierta = true; aplicarAbierta(); }
      if (estado.foto) { estado.foto = false; }
      renderEscenario(true); renderPanel(); renderBarra();
      const f = $(`[data-acc="agr"][data-id="${id}"][data-d="${d}"]`);
      (f && !f.disabled ? f : $(`[data-acc="agr"][data-id="${id}"][data-d="${-d}"]`))?.focus();
      break;
    }
    case 'modo': {
      const m = modoDe(id); cfg.modo = id; estado.modoElegido = true;
      if (m.bebidas) { if (!m.bebidas.includes(cfg.bebida)) cfg.bebida = null; } else cfg.bebida = null;
      renderPanel(); renderBarra(); escenaCombo();
      /* combo: se va a la pantalla "Armá tu combo" (side y bebida) */
      if (m.bebidas) setTimeout(() => irAComboArmar(), reducido() ? 0 : 180);
      break;
    }
    case 'side': case 'bebida': {
      const kind = acc, nuevo = id || null;
      const vuela = nuevo && (kind === 'side' || true);
      /* la pila también se nombra: su grupo de la transición se pinta encima, así lo que llega cae DETRÁS de la burger */
      transicion(vuela ? [{ de: el.querySelector('.op-media svg'), nombre: 'opcion', a: () => $(`#ce .ce-${kind}:not(.sale) svg`) }, { de: $('#escenario .pila'), nombre: 'pila-combo', a: () => $('#escenario .pila') }] : [], () => {
        cfg[kind] = nuevo; renderPanel(); renderBarra(); escenaCombo({ sinCaida: VT_OK && !reducido() && vuela });
      }).then(() => { if (kind === 'side' && cfg.modo !== 'individual' && !cfg.bebida) irASeccion('sec-bebida'); });
      break;
    }
    case 'armar': estado.abierta = !estado.abierta; estado.foto = false; $('#esc-col').classList.remove('foto'); aplicarAbierta({ fisica: true }); break;
    case 'expandir': alternarEscena(true); break;
    case 'ir-side': if (compacto() && estado.comboGrande) alternarEscena(false); irASeccion('sec-side'); break;
    case 'ir-bebida': if (compacto() && estado.comboGrande) alternarEscena(false); irASeccion('sec-bebida'); break;
    case 'contraer': alternarEscena(false); break;
    case 'agregar-cfg': agregarCfg(); break;
    case 'volver-menu':
      if (estado.pantalla === 'detalle') volverDeDetalle();
      else transicion([{ de: $('#p-pedido .pedido'), nombre: 'panel', a: () => $('#barra') }], () => { ir('menu', { mantenerScroll: true }); window.scrollTo(0, estado.menuScroll || 0); });
      break;
    case 'ver-pedido':
      if (estado.pantalla === 'menu') estado.menuScroll = scrollY;
      if (estado.pantalla === 'pago') { pararPago(); estado.pagoFase = 'elegir'; transicion([{ de: $('#p-pago .pago-total'), nombre: 'panel', a: () => $('#p-pedido .resumen') }], () => ir('pedido')); break; }
      transicion([{ de: $('#barra'), nombre: 'panel', a: () => $('#p-pedido .pedido') }], () => { if (estado.pantalla === 'detalle') { estado.cfg = null; estado.edit = null; $('#esc-col').classList.remove('con-combo', 'con-items', 'foto'); } ir('pedido'); });
      break;
    case 'pagar':
      if (cantItems()) {
        if (estado.pantalla === 'menu') estado.menuScroll = scrollY;
        transicion([{ de: el, nombre: 'pagar', a: () => $('#p-pago .pago-total') }], () => { estado.pagoFase = 'elegir'; estado.pago = null; ir('pago'); });
      }
      break;
    case 'lin': { const it = estado.carrito[Number(el.dataset.k)]; it.cant += Number(el.dataset.d); if (it.cant <= 0) estado.carrito.splice(estado.carrito.indexOf(it), 1); renderPedido(); renderBarra(); break; }
    case 'quitar': estado.carrito.splice(Number(el.dataset.k), 1); renderPedido(); renderBarra(); break;
    case 'editar': { const k = Number(el.dataset.k), it = estado.carrito[k]; abrirDetalle(it.slug, { ...it, sin: [...it.sin], agr: { ...it.agr } }, k, mediaDe(el.closest('.linea'))); break; }
    case 'pago':
      transicion([{ de: el, nombre: 'medio', a: () => $('#p-pago .proceso') }], () => { estado.pago = v; estado.pagoFase = 'proceso'; renderPago(); renderBarra(); });
      pararPago(); if (v !== 'efectivo') pagoTimers.push(setTimeout(pagoAprobado, v === 'qr' ? 6500 : 4500));
      break;
    case 'pago-otro': { const antes = estado.pago; pararPago(); transicion([{ de: $('#p-pago .proceso'), nombre: 'medio', a: () => $(`#p-pago .medio[data-v="${antes}"]`) }], () => { estado.pagoFase = estado.div ? 'div' : 'elegir'; estado.pago = null; renderPago(); renderBarra(); }); break; }
    case 'pago-ok': pagoAprobado(); break;
    case 'div-abrir': transicion([{ de: el, nombre: 'medio', a: () => $('#p-pago .div-resumen') }], () => { estado.div = { modo: 'iguales', partes: 2, pagos: [], fase: 'resumen', actual: 0, tecleo: '' }; estado.pagoFase = 'div'; renderPago(); renderBarra(); }); break;
    case 'div-modo': estado.div.modo = el.dataset.v; estado.div.tecleo = ''; renderPago(); break;
    case 'div-partes': estado.div.partes = Math.max(2, Math.min(8, estado.div.partes + Number(el.dataset.d))); renderPago(); break;
    case 'div-tecla': { const D = estado.div, k = el.dataset.k; D.tecleo = k === 'borrar' ? D.tecleo.slice(0, -1) : (D.tecleo + k).replace(/^0+/, '').slice(0, 7); renderPago(); break; }
    case 'div-chip': { const D = estado.div, f = Number(el.dataset.f), sal = saldoDiv(); D.tecleo = String(f >= 1 ? sal : Math.min(sal, Math.max(100, Math.round(total() * f / 10) * 10))); renderPago(); break; }
    case 'div-pagar': { const D = estado.div; D.actual = Number(el.dataset.m); D.fase = 'medio'; transicion([], () => renderPago()); break; }
    case 'div-resumen': { const D = estado.div; D.fase = 'resumen'; D.actual = 0; renderPago(); break; }
    case 'div-cancelar': if (estado.div.pagos.length) { estado.div.confirmar = true; renderPago(); } else transicion([], () => { estado.div = null; estado.pagoFase = 'elegir'; renderPago(); renderBarra(); }); break;
    case 'div-seguir': estado.div.confirmar = false; renderPago(); break;
    case 'div-cancelar-si': transicion([], () => { estado.div = null; estado.pagoFase = 'elegir'; renderPago(); renderBarra(); }); break;
    case 'fin-otro': reset(); break;
    case 'cancelar': abrirCancelar(); break;
    case 'cancelar-si': reset(); break;
    case 'modal-cerrar': cerrarModal(); break;
    case 'up-modo': estado.up.modo = id; estado.up.paso = 'arma'; estado.up.side = null; estado.up.bebida = null; estado.up.visto = {}; renderUpsell(); break;
    case 'up-side': case 'up-bebida': {
      const kind = acc === 'up-side' ? 'side' : 'bebida';
      transicion([{ de: el.querySelector('.op-media svg'), nombre: 'opcion', a: () => $(`#modal-caja .ce-${kind} svg`) }], () => {
        estado.up[kind] = id; if (VT_OK && !reducido()) estado.up.visto[kind] = id; renderUpsell();
      });
      break;
    }
    case 'up-volver': estado.up.paso = 'modo'; renderUpsell(); break;
    case 'up-hacer': aplicarCombo(); break;
    case 'up-no': if (estado.up && estado.up.paso === 'modo') { estado.up.paso = 'acomp'; renderUpsell(); } else cerrarModal(); break;
    case 'seguis-si': cerrarModal(); actividad(); break;
    case 'seguis-no': reset(); break;
  }
});
function pagoAprobado() {
  pararPago();
  if (estado.pantalla !== 'pago') return;
  if (estado.div) {
    const D = estado.div;
    D.pagos.push({ metodo: estado.pago, monto: D.actual });
    if (saldoDiv() > 0) {
      estado.pagoFase = 'aprobado'; renderPago(); renderBarra();
      pagoTimers.push(setTimeout(() => { if (estado.pantalla !== 'pago' || !estado.div) return; D.fase = 'resumen'; D.actual = 0; D.tecleo = ''; estado.pago = null; estado.pagoFase = 'div'; transicion([], () => { renderPago(); renderBarra(); }); }, 1300));
      return;
    }
    estado.pagosFinal = D.pagos.slice();
  } else estado.pagosFinal = null;
  estado.hwPedido = estado.carrito.some((x) => x.slug === 'halloweiss');
  estado.totalFinal = total();
  estado.pedidos++; estado.numero = estado.pedidos;
  if (estado.pago === 'efectivo' && !estado.div) { finalizar(); return; }
  estado.pagoFase = 'aprobado'; renderPago(); renderBarra();
  pagoTimers.push(setTimeout(finalizar, 1300));
}
function finalizar() {
  const de = $('#p-pago .check') || $('#p-pago .pago-total');
  transicion([{ de, nombre: 'resumen', a: () => $('#p-fin .fin-num') }], () => { estado.carrito = []; ir('fin'); });
}
$('#burger').addEventListener('click', () => { if (enComboP() || compacto()) { alternarEscena(); return; } estado.abierta = !estado.abierta; aplicarAbierta({ fisica: true }); });
/* deslizar hacia abajo sobre el escenario grande lo cierra; el escenario se re-mide mientras cambia de alto */
(() => {
  const col = $('#esc-col'); let y0 = null;
  col.addEventListener('pointerdown', (e) => { y0 = col.classList.contains('grande') ? e.clientY : null; });
  col.addEventListener('pointerup', (e) => { if (y0 != null && e.clientY - y0 > 70) alternarEscena(false); y0 = null; });
  if (window.ResizeObserver) {
    let raf = 0;
    const ro = new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { if (estado.pantalla === 'detalle' && estado.escP) medir($('#escenario'), estado.escP, opcMedir()); }); });
    ro.observe($('#esc-caja') || col); ro.observe($('#esc-titulo'));
  }
})();
addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalTipo && modalTipo !== 'seguis') cerrarModal(); });
/* efectos (queso derretido) en pausa si el escenario no se ve o la pestaña está oculta */
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((es) => es.forEach((e) => e.target.classList.toggle('pausa', !e.isIntersecting)));
  const mirar = () => { ['#escenario', '#ini-esc'].forEach((sel) => { const el = $(sel); if (el && !el.dataset.io) { el.dataset.io = '1'; io.observe(el); } }); };
  mirar(); new MutationObserver(mirar).observe(document.body, { childList: true, subtree: true });
}
document.addEventListener('visibilitychange', () => document.documentElement.classList.toggle('pausa-doc', document.hidden));
let tRes;
matchMedia('(orientation: portrait)').addEventListener('change', () => { clearTimeout(tRes); tRes = setTimeout(() => { if (estado.pantalla === 'detalle' && estado.escP) { medir($('#escenario'), estado.escP, opcMedir()); escenaCombo(); } if (estado.pantalla === 'inicio') mostrarHero(HERO[heroI % HERO.length], false); if (estado.pantalla === 'menu') moverIndicador(null); }, 200); });
addEventListener('resize', () => {
  clearTimeout(tRes);
  tRes = setTimeout(() => {
    if (estado.pantalla === 'detalle' && estado.escP) { medir($('#escenario'), estado.escP, opcMedir()); escenaCombo(); }
    if (estado.pantalla === 'inicio') mostrarHero(HERO[heroI % HERO.length], false);
  }, 150);
});

/* =====================================================================
   23. ARRANQUE + ATAJOS POR URL
   ===================================================================== */
document.getElementById('defs-host').innerHTML = `<svg width="0" height="0" style="position:absolute"><defs>${DEFS_FIJOS}${DEFS_ILU}</defs></svg>`;
const DEMO = () => [
  { tipo: 'burger', slug: 'smack', modo: 'combo2', side: 'papas', bebida: 'corona', sin: ['salsa-ketchup|'], agr: { bacon: 1 }, cant: 1 },
  { tipo: 'burger', slug: 'crispy', modo: 'individual', side: 'papas', bebida: 'agua', sin: ['tomate|'], agr: {}, cant: 1 },
  { tipo: 'burger', slug: 'bacon-jam', modo: 'combo1', side: 'boniatos', bebida: 'pepsi', sin: [], agr: {}, cant: 2 },
  { tipo: 'extra', id: 'papas-weiss', cant: 1 },
  { tipo: 'postre', id: 'franui', cant: 2 },
  { tipo: 'ensalada', id: 'bacon-salad', pollo: 'crispy', combo: false, cant: 1 },
];
function arrancar() {
  capasListas = true;
  arrancarGoteo();
  document.documentElement.style.setProperty('--friso', `url("data:image/svg+xml,${encodeURIComponent(frisoMosaico({ semilla: 31 }))}")`);
  document.documentElement.style.setProperty('--montes', `url("data:image/svg+xml,${encodeURIComponent(frisoMosaico({ semilla: 57, n: 13, op: 1, color: '#6f604d', fondo: '#fff' }))}")`);
  const lg = q.get('lang');
  if (LANGS.includes(lg)) estado.lang = estado.langInicial = lg;
  if (q.has('llevar')) estado.servicio = 'llevar';
  if (q.has('demo')) estado.carrito = DEMO();
  if (q.get('carrito')) { try { const c = JSON.parse(decodeURIComponent(escape(atob(q.get('carrito'))))); if (Array.isArray(c)) estado.carrito = c; } catch (e) { /* carrito inválido */ } }
  let p = q.get('pantalla');
  const slug = q.get('burger');
  if (!p && slug) p = 'detalle';
  if (!p && q.has('filtro')) { p = 'menu'; estado.cat = { pollo: 'pollo', veggie: 'veggie' }[q.get('filtro')] || 'burgers'; }
  if (!p && q.has('paso')) p = { 1: 'menu', 2: slug ? 'detalle' : 'menu', 3: 'menu', 4: 'pedido' }[q.get('paso')] || 'menu';
  if (q.get('paso') === '3') estado.cat = 'picar';
  if (q.has('confirmado')) p = 'fin';
  if (q.has('upsell')) p = 'menu';
  if (q.get('cat') && catDe(q.get('cat'))) { estado.cat = q.get('cat'); p = p || 'menu'; }
  if (!['menu', 'detalle', 'pedido', 'pago', 'fin'].includes(p)) p = 'inicio';
  if (p !== 'inicio' && !estado.servicio) estado.servicio = 'aca';
  if (['pedido', 'pago', 'fin'].includes(p) && !estado.carrito.length && !q.has('vacio')) estado.carrito = DEMO();
  const congelar = Number(q.get('congelar'));
  /* congela todo en ese instante y sigue congelando lo que arranque después (transiciones por clases) */
  if (congelar) setTimeout(() => {
    document.getAnimations().forEach((a) => { try { a.pause(); } catch (e) { /* */ } });
    const tope = setTimeout(() => 0, 0); for (let i = 0; i <= tope + 50; i++) { clearTimeout(i); clearInterval(i); }
    window.setTimeout = () => 0; window.setInterval = () => 0; window.requestAnimationFrame = () => 0;
  }, congelar);

  if (p === 'detalle') {
    const s = burgerDe(slug) ? slug : 'smack';
    const cfg = nuevaCfg(s, q.get('modo'));
    if (sideDe(q.get('side'))) cfg.side = q.get('side');
    const m = modoDe(cfg.modo), bq = q.get('bebida');
    if (m.bebidas) { if (m.bebidas.includes(bq)) cfg.bebida = bq; } else if (bebidaDe(bq)) cfg.bebida = bq;
    const b = burgerDe(s);
    (q.get('sin') || '').split(',').filter(Boolean).forEach((x) => {
      const g = gruposIng(b).find((gg) => !gg.fijo && (gg.tipo === x || gg.tipo.startsWith(x) || gg.grupo === x));
      if (g && !cfg.sin.includes(g.grupo)) cfg.sin.push(g.grupo);
    });
    (q.get('agregar') || '').split(',').filter(Boolean).forEach((x) => {
      const [aid, n] = x.split(':'); const a = AGREGADOS.find((y) => y.id === aid);
      if (a) cfg.agr[aid] = Math.min(a.max, Number(n) || 1);
    });
    estado.cfg = cfg;
    estado.modoElegido = q.has('modo');
    estado.paso = { ingredientes: 0, agregados: 1, combo: 2, armar: 3 }[q.get('tab')] ?? (q.has('modo') ? 2 : q.has('agregar') ? 1 : 0);
    if (estado.paso === 2 && q.has('modo') && (q.has('side') || q.has('bebida')) && cfg.modo !== 'individual') estado.paso = 3;
    estado.abierta = compacto() ? q.has('abierta') : !q.has('cerrada');
    estado.comboGrande = compacto() && q.has('abierta') && enComboP();
    ir('detalle');
    if (estado.abierta && !reducido() && !q.has('quieta')) {
      const esc = $('#escenario');
      estado.abierta = false; esc.classList.remove('abierta', 'quieta');
      caerCapas(esc, () => { estado.abierta = true; aplicarAbierta(); });
    } else aplicarAbierta();
    if (enComboP()) escenaCombo({ sinCaida: true });
  } else if (p === 'fin') {
    estado.hwPedido = estado.carrito.some((x) => x.slug === 'halloweiss') || q.has('hw');
    estado.pago = 'tarjeta'; estado.totalFinal = total(); estado.pedidos++; estado.numero = estado.pedidos; estado.carrito = [];
    ir('fin');
  } else if (p === 'pago') {
    const pg = q.get('pago');
    if (['tarjeta', 'qr', 'efectivo'].includes(pg)) { estado.pago = pg; estado.pagoFase = 'proceso'; }
    ir('pago');
  } else {
    ir(p);
  }
  if (q.has('upsell')) {
    const s = burgerDe(q.get('upsell')) ? q.get('upsell') : 'smack';
    const ref = sumarLinea(nuevaCfg(s, 'individual'));
    renderMenu(); renderBarra();
    abrirUpsell(ref);
    if (q.get('upsellpaso') === '2') { estado.up.modo = 'combo2'; estado.up.paso = 'arma'; renderUpsell(); }
    if (q.get('upsellpaso') === '3') { estado.up.paso = 'acomp'; renderUpsell(); }
  }
  if (q.has('seguis')) mostrarSeguis();
}
(q.has('sincarga') || q.has('sincapas') ? probarCapas() : precargarTodo()).then(() => { arrancar(); requestAnimationFrame(cerrarCarga); });
})();
